  <main>
    <div id="demos-root">
      <div class="container" style="padding-top: 48px;">
        <p>Loading demos…</p>
      </div>
    </div>
  </main>

  <script type="module" src="/js/theme.js"></script>
  <script type="module" src="/js/nav.js"></script>
  <script type="module" src="/js/bottom-nav.js"></script>
  <script type="module" src="/js/cookie-consent.js"></script>
  <script type="module" src="/js/pwa.js"></script>
  <script type="module">
    import { getDemoProjects, getProjectById, DEMOS_PAGE_SIZE } from '/js/projects-data.js';
    import { getProfilesByIds } from '/js/profiles-data.js';
    import { escapeHtml, avatarHtml, typeBadgeHtml, safeUrl } from '/js/utils.js';
    import { parseMedia, mediaHtml, uploadedPosterFor, controlEmbeddedVideo } from '/js/media.js';
    import { scrollImageFor } from '/js/scroll-styles.js';
    import { stripMarkdown } from '/js/markdown.js';
    import { icon } from '/js/icons.js';
    import { logProjectView } from '/js/views-data.js';

    // The home page is Demos - XOXD is only demos now: every published entry
    // with a live URL, one full screen each, the clip (or picture) first and
    // "Try it" under it. (It used to live at /demos, beside a general feed and
    // Explore; demos.html now forwards here.) Nothing from the demo
    // itself runs here - "Try it" opens it in a new tab.
    //
    // Scrolling is the browser's own (CSS scroll snap), so momentum, trackpads
    // and assistive tech behave as they do everywhere else. What this script
    // manages is what each card holds while you scroll:
    //   - the card on screen plays its clip, muted until you unmute;
    //   - the next one already has its clip loading (preload="auto"), so it
    //     starts the moment you get there;
    //   - the one after that and the one you just left have only the clip's
    //     metadata;
    //   - every other card holds just its poster picture - no <video> source,
    //     no embed - so a long feed costs no more memory than a short one.
    // The next page is fetched while three cards are still left.

    const root = document.getElementById('demos-root');
    const VIEW_DWELL_MS = 3000;

    const cards = []; // { el, project, video, embed }
    const ids = new Set();
    let container = null;
    let active = -1;
    let soundOn = false;
    let loading = false;
    let exhausted = false;
    let dwell = null;

    function hueFor(id) {
      let h = 0;
      for (const ch of String(id)) h = (h * 31 + ch.charCodeAt(0)) % 360;
      return h;
    }

    function cardHtml(project, profile) {
      const media = parseMedia(project.mediaUrl, project.type);
      const isClip = Boolean(media && media.kind === 'video');
      const isEmbed = Boolean(media && media.kind === 'iframe' && !media.compact);
      const framePoster = isClip ? uploadedPosterFor(media.src) : '';
      const picture = media && media.kind === 'image' ? media.src : '';
      const poster = framePoster || picture || scrollImageFor(project);
      const summary =
        project.summary || stripMarkdown(project.description || '').replace(/\s+/g, ' ').trim().slice(0, 160);
      const live = safeUrl(project.liveUrl);
      const repo = safeUrl(project.repoUrl);
      const tags = project.tags.slice(0, 4).map((t) => `<span class="tag">${escapeHtml(t)}</span>`).join('');
      const playable = isClip || isEmbed;
      return `
        <section class="scroll-card demo-card${poster || media ? ' has-image' : ' is-text'}" style="--scroll-hue:${hueFor(project.id)}" data-id="${escapeHtml(project.id)}">
          <div class="demo-media">
            ${poster ? `<img class="demo-poster${framePoster ? ' is-frame' : ''}" src="${escapeHtml(safeUrl(poster))}" alt="" loading="lazy" decoding="async" onerror="this.remove()" />` : ''}
            ${isClip ? `<video class="demo-video" muted loop playsinline preload="none" data-src="${escapeHtml(media.src)}"></video>` : ''}
            ${isEmbed ? '<div class="demo-embed"></div>' : ''}
          </div>
          ${playable ? `<button class="scroll-mute-btn is-muted" type="button" data-action="mute" aria-label="Unmute" aria-pressed="false">
            <span class="mute-icon mute-icon-on">${icon('volume-2', { size: 18 })}</span>
            <span class="mute-icon mute-icon-off">${icon('volume-x', { size: 18 })}</span>
          </button>` : ''}
          <div class="scroll-content">
            <a class="scroll-author" href="/profile?user=${encodeURIComponent(project.uid)}">
              ${avatarHtml(profile ? profile.avatarUrl : '', project.authorName, 'scroll-avatar')}
              <span>@${escapeHtml(project.authorName)}</span>
            </a>
            <h2>${escapeHtml(project.title)}</h2>
            ${summary ? `<p>${escapeHtml(summary)}</p>` : ''}
            <div class="tag-list">${typeBadgeHtml(project.type)}${tags}</div>
            <div class="demo-actions">
              ${live ? `<a class="btn btn-primary" href="${escapeHtml(live)}" target="_blank" rel="noopener noreferrer">${icon('external-link', { size: 16 })} Try it</a>` : ''}
              ${repo ? `<a class="btn btn-secondary" href="${escapeHtml(repo)}" target="_blank" rel="noopener noreferrer">${icon('code', { size: 16 })} Source</a>` : ''}
              <a class="btn btn-ghost" href="/project?id=${encodeURIComponent(project.id)}">Details</a>
            </div>
          </div>
        </section>`;
    }

    // ------------------------------------------------ what each card holds

    function loadClip(video, preload) {
      video.preload = preload;
      if (!video.getAttribute('src')) video.src = video.dataset.src;
    }

    function unloadClip(card) {
      const video = card.video;
      if (!video || !video.getAttribute('src')) return;
      video.pause();
      video.removeAttribute('src');
      video.load(); // drops what was buffered, which is the point
      card.el.classList.remove('has-started');
    }

    function mountEmbed(card) {
      if (!card.embed || card.embed.firstChild) return;
      card.embed.innerHTML = mediaHtml(card.project.mediaUrl, { inline: true, typeHint: card.project.type });
      const iframe = card.embed.querySelector('iframe');
      if (!iframe) return;
      iframe.addEventListener(
        'load',
        () => {
          controlEmbeddedVideo(iframe, soundOn ? 'unmute' : 'mute');
          controlEmbeddedVideo(iframe, 'play');
        },
        { once: true }
      );
    }

    function syncMute(card) {
      const btn = card.el.querySelector('[data-action="mute"]');
      if (!btn) return;
      btn.classList.toggle('is-muted', !soundOn);
      btn.setAttribute('aria-pressed', String(soundOn));
      btn.setAttribute('aria-label', soundOn ? 'Mute' : 'Unmute');
    }

    // offset: this card's distance from the one on screen.
    function settle(card, offset) {
      if (card.video) {
        if (offset === 0) {
          loadClip(card.video, 'auto');
          card.video.muted = !soundOn;
          card.video.play().catch(() => {});
        } else if (offset === 1) {
          card.video.pause();
          loadClip(card.video, 'auto');
        } else if (offset === 2 || offset === -1) {
          card.video.pause();
          loadClip(card.video, 'metadata');
        } else {
          unloadClip(card);
        }
      }
      if (card.embed) {
        // An embed is a whole page of someone else's player; only the card
        // on screen gets one.
        if (offset === 0) mountEmbed(card);
        else card.embed.innerHTML = '';
      }
      if (offset === 0) syncMute(card);
    }

    function setActive(index) {
      if (index === active || !cards[index]) return;
      active = index;
      cards.forEach((card, i) => settle(card, i - index));
      // The address names the demo on screen, so it can be shared or come
      // back to; replaceState, so scrolling doesn't fill the history.
      history.replaceState(null, '', `#${cards[index].project.id}`);
      clearTimeout(dwell);
      const id = cards[index].project.id;
      // A view counts once the card has stayed on screen for 3 seconds.
      dwell = setTimeout(() => {
        logProjectView(id).catch(() => {});
      }, VIEW_DWELL_MS);
      if (cards.length - index <= 3) loadMore();
    }

    function go(index) {
      const card = cards[Math.max(0, Math.min(cards.length - 1, index))];
      if (card) card.el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    const observer = new IntersectionObserver(
      (entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting && entry.intersectionRatio >= 0.6) {
            setActive(cards.findIndex((c) => c.el === entry.target));
          }
        });
      },
      { threshold: [0.6] }
    );

    // --------------------------------------------------------- loading

    async function addCards(projects) {
      const fresh = projects.filter((p) => !ids.has(p.id));
      if (!fresh.length) return;
      const profiles = await getProfilesByIds(fresh.map((p) => p.uid)).catch(() => new Map());
      const holder = document.createElement('div');
      holder.innerHTML = fresh.map((p) => cardHtml(p, profiles.get(p.uid))).join('');
      [...holder.children].forEach((el, i) => {
        const card = {
          el,
          project: fresh[i],
          video: el.querySelector('.demo-video'),
          embed: el.querySelector('.demo-embed'),
        };
        // The poster stays up until the clip has a frame of its own to show.
        if (card.video) card.video.addEventListener('playing', () => el.classList.add('has-started'));
        ids.add(card.project.id);
        cards.push(card);
        container.appendChild(el);
        observer.observe(el);
        if (active >= 0) settle(card, cards.length - 1 - active);
      });
    }

    async function loadMore() {
      if (loading || exhausted) return;
      loading = true;
      try {
        const last = cards[cards.length - 1];
        const page = await getDemoProjects({ before: last ? last.project.createdAt : undefined });
        if (page.length < DEMOS_PAGE_SIZE) exhausted = true;
        await addCards(page);
      } catch {
        // Tried again on the next card change.
      } finally {
        loading = false;
      }
    }

    // ------------------------------------------------------------ input

    function toggleSound() {
      soundOn = !soundOn;
      const card = cards[active];
      if (!card) return;
      if (card.video) card.video.muted = !soundOn;
      const iframe = card.embed && card.embed.querySelector('iframe');
      if (iframe) controlEmbeddedVideo(iframe, soundOn ? 'unmute' : 'mute');
      syncMute(card);
    }

    root.addEventListener('click', (e) => {
      if (e.target.closest('[data-action="mute"]')) toggleSound();
    });

    // One card per key press, like one swipe. Left alone while typing, and
    // when a modifier is held so browser shortcuts still work.
    document.addEventListener('keydown', (e) => {
      if (!container || e.altKey || e.ctrlKey || e.metaKey) return;
      if (e.target.closest && e.target.closest('input, textarea, select, [contenteditable]')) return;
      if (['ArrowDown', 'PageDown', 'j', 'J'].includes(e.key)) {
        e.preventDefault();
        go(active + 1);
      } else if (['ArrowUp', 'PageUp', 'k', 'K'].includes(e.key)) {
        e.preventDefault();
        go(active - 1);
      } else if (e.key === 'm' || e.key === 'M') {
        toggleSound();
      }
    });

    // A hidden tab shouldn't keep a clip playing.
    document.addEventListener('visibilitychange', () => {
      const video = cards[active] && cards[active].video;
      if (!video) return;
      if (document.hidden) video.pause();
      else video.play().catch(() => {});
    });

    // ------------------------------------------------------------- start

    (async () => {
      try {
        const first = await getDemoProjects();
        // Opened from a link to one demo (#id): that one comes first, even
        // when it is older than the first page.
        const wanted = decodeURIComponent(location.hash.slice(1));
        let lead = [];
        if (wanted && !first.some((p) => p.id === wanted)) {
          const p = await getProjectById(wanted).catch(() => null);
          if (p && p.published && p.liveUrl) lead = [p];
        }
        if (!first.length && !lead.length) {
          root.innerHTML = `
            <div class="container" style="padding-top:48px;">
              <div class="empty-state">
                <h3>No demos yet</h3>
                <p>Every demo shows up here, one screen each, with its clip first. Be the first to add one.</p>
                <a class="btn btn-primary" href="/dashboard">Add a demo</a>
              </div>
            </div>`;
          return;
        }
        if (first.length < DEMOS_PAGE_SIZE) exhausted = true;
        root.innerHTML = '<div class="scrolls-container demos-container" tabindex="-1"></div>';
        container = root.firstElementChild;
        await addCards([...lead, ...first]);
        const start = Math.max(0, cards.findIndex((c) => c.project.id === wanted));
        if (start > 0) cards[start].el.scrollIntoView({ block: 'start' });
        setActive(start);
        container.focus({ preventScroll: true });
      } catch (err) {
        root.innerHTML = `<div class="container" style="padding-top:48px;"><p>Could not load demos: ${escapeHtml(err.message)}</p></div>`;
      }
    })();
  </script>
