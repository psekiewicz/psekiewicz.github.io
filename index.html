  <main>
    <div class="feed-shell">
      <section class="feed-main" aria-labelledby="feed-title">
        <div class="feed-head">
          <h1 class="feed-title" id="feed-title">Home</h1>
          <div class="feed-tabs" role="tablist" aria-label="Feed">
            <button class="feed-tab" type="button" role="tab" id="tab-foryou" aria-selected="true">For you</button>
            <button class="feed-tab" type="button" role="tab" id="tab-following" aria-selected="false">Following</button>
            <button class="feed-tab" type="button" role="tab" id="tab-latest" aria-selected="false">Latest</button>
          </div>
        </div>

        <div class="feed-list">
          <div id="feed-intro"></div>
          <div class="feed-list" id="feed-list" role="tabpanel" aria-labelledby="tab-foryou">
            <div class="post-skeleton" aria-hidden="true"></div>
            <div class="post-skeleton" aria-hidden="true"></div>
          </div>
          <div class="feed-more" id="feed-more" hidden>
            <button class="btn btn-secondary" type="button" id="feed-more-btn">Show more</button>
          </div>
        </div>
      </section>

      <aside class="feed-rail" id="feed-rail" aria-label="Suggestions"></aside>
    </div>
  </main>

    <div class="container">
      <span>© <span id="year"></span> XOXD</span>

  <script type="module" src="/js/theme.js"></script>
  <script type="module" src="/js/nav.js"></script>
  <script type="module" src="/js/bottom-nav.js"></script>
  <script type="module" src="/js/cookie-consent.js"></script>
  <script type="module" src="/js/pwa.js"></script>
  <script type="module" src="/js/animations.js"></script>
  <script type="module">
    import { DISCOVER_POOL, getPublishedProjects } from '/js/projects-data.js';
    import { getProfilesByIds } from '/js/profiles-data.js';
    import { escapeHtml, avatarHtml } from '/js/utils.js';
    import { getCurrentUser, displayNameOf } from '/js/auth.js';
    import { getLevelsForUsers } from '/js/levels.js';
    import { getLikeCounts, getLikedSet } from '/js/likes-data.js';
    import { getCommentCounts } from '/js/comments-data.js';
    import { getSavedSet } from '/js/saves-data.js';
    import { getFollowingIds } from '/js/follows-data.js';
    import { rankFeed, getSeenIds } from '/js/feed-rank.js';
    import { postHtml, bindPostActions } from '/js/post-card.js';
    import { renderRail } from '/js/feed-rail.js';
    import { icon } from '/js/icons.js';

    // Home is the feed. It used to be a marketing page that sent signed-in
    // visitors straight on to /projects - now everyone lands on posts, and
    // people without an account get a short welcome above them instead of a
    // pitch standing between them and any content.

    document.getElementById('year').textContent = new Date().getFullYear();

    const PAGE = 12;
    const list = document.getElementById('feed-list');
    const intro = document.getElementById('feed-intro');
    const more = document.getElementById('feed-more');
    const tabs = {
      foryou: document.getElementById('tab-foryou'),
      following: document.getElementById('tab-following'),
      latest: document.getElementById('tab-latest'),
    };

    const state = {
      user: null,
      projects: [],
      profiles: new Map(),
      levels: new Map(),
      likeCounts: new Map(),
      commentCounts: new Map(),
      liked: new Set(),
      saved: new Set(),
      followingIds: new Set(),
      tab: 'foryou',
      order: { foryou: null, following: null, latest: null },
      shown: PAGE,
    };

    bindPostActions(list, { getUser: () => state.user });

    function introHtml(user) {
      if (!user) {
        return `
          <section class="welcome-card">
            <h2>See what people are making.</h2>
            <p>Music, videos, images and apps from people who make things. Follow them, like what you love, and share your own.</p>
            <div class="welcome-actions">
              <a class="btn btn-primary" href="/register.html">Create account</a>
              <a class="btn btn-secondary" href="/login.html">Log in</a>
            </div>
          </section>
        `;
      }
      const profile = state.profiles.get(user.id);
      const name = (profile && profile.displayName) || displayNameOf(user);
      return `
        <div class="composer">
          ${avatarHtml(profile ? profile.avatarUrl : '', name)}
          <button class="composer-prompt" type="button" id="composer-open" aria-haspopup="dialog">What are you sharing, ${escapeHtml(name.split(' ')[0])}?</button>
          <button class="btn btn-primary" type="button" id="composer-post" aria-haspopup="dialog">${icon('plus', { size: 16 })} Post</button>
        </div>
      `;
    }

    // Each tab's order is worked out once and kept, so switching back to
    // For you doesn't reshuffle what you were halfway down.
    function ordered(tab) {
      if (!state.order[tab]) {
        if (tab === 'foryou') {
          state.order[tab] = rankFeed(state.projects, {
            likeCounts: state.likeCounts,
            commentCounts: state.commentCounts,
            followingIds: state.followingIds,
            seenIds: getSeenIds(),
          });
        } else if (tab === 'following') {
          state.order[tab] = state.projects
            .filter((p) => state.followingIds.has(p.uid))
            .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
        } else {
          state.order[tab] = [...state.projects].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
        }
      }
      return state.order[tab];
    }

    function emptyHtml(tab) {
      if (tab === 'following') {
        return state.user
          ? `<div class="feed-empty"><h3>Nothing from people you follow yet</h3><p>Follow a few people and their posts show up here.</p><a class="btn btn-primary" href="/leaderboard.html">Find people</a></div>`
          : `<div class="feed-empty"><h3>Follow people to fill this tab</h3><p>Log in to see posts from the people you follow.</p><a class="btn btn-primary" href="/login.html">Log in</a></div>`;
      }
      return `<div class="feed-empty"><h3>No posts yet</h3><p>Be the first to share something.</p></div>`;
    }

    function render() {
      const items = ordered(state.tab);
      if (items.length === 0) {
        list.innerHTML = emptyHtml(state.tab);
        more.hidden = true;
        return;
      }
      list.innerHTML = items
        .slice(0, state.shown)
        .map((p) =>
          postHtml(p, {
            author: state.profiles.get(p.uid),
            level: state.levels.get(p.uid),
            likeCount: state.likeCounts.get(p.id) || 0,
            commentCount: state.commentCounts.get(p.id) || 0,
            liked: state.liked.has(p.id),
            saved: state.saved.has(p.id),
          })
        )
        .join('');
      more.hidden = items.length <= state.shown;
    }

    // Likes and saves change on the page without a reload; read them back off
    // the posts before a re-render so a tab switch doesn't undo them.
    function captureInteractions() {
      list.querySelectorAll('.post').forEach((post) => {
        const id = post.dataset.projectId;
        const like = post.querySelector('[data-action="like"]');
        const save = post.querySelector('[data-action="save"]');
        if (like) {
          const on = like.getAttribute('aria-pressed') === 'true';
          if (on) state.liked.add(id);
          else state.liked.delete(id);
          state.likeCounts.set(id, Number(like.querySelector('[data-count]').textContent) || 0);
        }
        if (save) {
          if (save.getAttribute('aria-pressed') === 'true') state.saved.add(id);
          else state.saved.delete(id);
        }
      });
    }

    function selectTab(tab) {
      captureInteractions();
      state.tab = tab;
      state.shown = PAGE;
      for (const [key, el] of Object.entries(tabs)) el.setAttribute('aria-selected', String(key === tab));
      list.setAttribute('aria-labelledby', tabs[tab].id);
      render();
    }

    for (const [key, el] of Object.entries(tabs)) el.addEventListener('click', () => selectTab(key));
    document.getElementById('feed-more-btn').addEventListener('click', () => {
      captureInteractions();
      state.shown += PAGE;
      render();
    });

    intro.addEventListener('click', async (e) => {
      if (!e.target.closest('#composer-open, #composer-post')) return;
      const sheet = await import('/js/create-sheet.js');
      sheet.openSheet();
    });

    (async () => {
      try {
        const [user, projects] = await Promise.all([
          getCurrentUser().catch(() => null),
          getPublishedProjects({ limit: DISCOVER_POOL }),
        ]);
        state.user = user;
        state.projects = projects;
        const ids = projects.map((p) => p.id);
        const authorIds = projects.map((p) => p.uid).concat(user ? [user.id] : []);

        const [profiles, likeCounts, commentCounts, liked, saved, followingIds] = await Promise.all([
          getProfilesByIds(authorIds).catch(() => new Map()),
          getLikeCounts(ids).catch(() => new Map()),
          getCommentCounts(ids).catch(() => new Map()),
          user ? getLikedSet(user.id, ids).catch(() => new Set()) : new Set(),
          user ? getSavedSet(user.id, ids).catch(() => new Set()) : new Set(),
          user ? getFollowingIds(user.id).catch(() => new Set()) : new Set(),
        ]);
        Object.assign(state, { profiles, likeCounts, commentCounts, liked, saved, followingIds });

        intro.innerHTML = introHtml(user);
        render();
        list.classList.add('is-settled');
        renderRail(document.getElementById('feed-rail'), { user, projects, followingIds: new Set(followingIds) });

        // Levels cost a few extra queries - painted in once the feed is up.
        state.levels = await getLevelsForUsers(projects.map((p) => p.uid)).catch(() => new Map());
        captureInteractions();
        render();
      } catch (err) {
        list.innerHTML = `<div class="feed-empty"><h3>Could not load the feed</h3><p>${escapeHtml(err.message)}</p></div>`;
      }
    })();
  </script>
