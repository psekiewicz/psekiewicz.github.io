<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>XOXD</title>
  <!-- Scrolls was replaced by Demos, now the home page (/). Links to it are still out
       there, so this page only forwards them: a link to one entry
       (scrolls?project=<id>) opens that entry, anything else opens Demos. -->
  <script>
    (function () {
      var id = new URLSearchParams(location.search).get('project');
      location.replace(id ? '/project?id=' + encodeURIComponent(id) : '/');
    })();
  </script>
  <meta http-equiv="refresh" content="0; url=/" />
  <link rel="canonical" href="https://psekiewicz.github.io/" />
</head>
<body>
  <p><a href="/">Scrolls is now Demos.</a></p>
</body>
</html>
