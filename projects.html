<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script>(function(){var t=localStorage.getItem('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Browse Projects — Showcase</title>
  <meta name="description" content="Discover what the community has published." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Showcase" />
  <meta property="og:title" content="Browse Projects — Showcase" />
  <meta property="og:description" content="Discover what the community has published." />
  <meta property="og:url" content="https://psekiewicz.github.io/projects.html" />
  <meta property="og:image" content="https://psekiewicz.github.io/icons/social-preview.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Browse Projects — Showcase" />
  <meta name="twitter:description" content="Discover what the community has published." />
  <meta name="twitter:image" content="https://psekiewicz.github.io/icons/social-preview.png" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#f2efe9" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#14120f" media="(prefers-color-scheme: dark)" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Showcase" />
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a class="brand" href="/index.html">
        <span class="brand-mark">S</span>
        Showcase
      </a>
      <div class="nav-links">
        <a class="nav-link" href="index.html">Home</a>
        <a class="nav-link" href="projects.html">Projects</a>
        <a class="nav-link" href="scrolls.html">Scrolls</a>
        <a class="nav-link" href="shop.html">Shop</a>
        <a class="nav-link" href="leaderboard.html">Leaderboard</a>
      </div>
      <div class="nav-right">
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle dark mode"></button>
        <div class="nav-actions" id="nav-actions"></div>
      </div>
      <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <main>
    <section class="section">
      <div class="container">
        <div class="section-head">
          <h2>All projects</h2>
          <p>Discover what the community has published.</p>
        </div>

        <div class="filter-bar">
          <input type="search" id="search-input" placeholder="Search by title, summary, or description…" />
          <select id="type-filter">
            <option value="">All types</option>
            <option value="website">Website</option>
            <option value="mobile_app">Mobile App</option>
            <option value="game">Game</option>
            <option value="design">Design</option>
            <option value="library">Library / Tool</option>
            <option value="other">Other</option>
          </select>
          <select id="people-filter" hidden>
            <option value="all">Everyone</option>
            <option value="following">People I follow</option>
          </select>
          <select id="tag-filter">
            <option value="">All tags</option>
          </select>
        </div>

        <div id="projects-container" class="project-grid">
          <p>Loading projects…</p>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span>© <span id="year"></span> Showcase</span>
      <a href="index.html">Home</a>
    </div>
  </footer>

  <script type="module" src="/js/theme.js"></script>
  <script type="module" src="/js/nav.js"></script>
  <script type="module" src="/js/bottom-nav.js"></script>
  <script type="module" src="/js/cookie-consent.js"></script>
  <script type="module" src="/js/pwa.js"></script>
  <script type="module">
    import { getPublishedProjects } from '/js/projects-data.js';
    import { getProfilesByIds } from '/js/profiles-data.js';
    import { escapeHtml, timeAgo, avatarHtml, typeBadgeHtml, safeUrl } from '/js/utils.js';
    import { getLevelsForUsers, levelChipHtml } from '/js/levels.js';
    import { getFollowingIds } from '/js/follows-data.js';
    import { getCurrentUser } from '/js/auth.js';

    document.getElementById('year').textContent = new Date().getFullYear();

    let allProjects = [];
    let authorProfiles = new Map();
    let authorLevels = new Map();
    // Following someone used to change nothing about what you saw. Empty
    // until the session resolves, which is also why the filter stays hidden
    // for signed-out visitors — there'd be nothing to filter by.
    let followingIds = new Set();
    const container = document.getElementById('projects-container');
    const searchInput = document.getElementById('search-input');
    const tagFilter = document.getElementById('tag-filter');
    const typeFilter = document.getElementById('type-filter');
    const peopleFilter = document.getElementById('people-filter');

    function projectCard(project) {
      const thumb = project.imageUrl
        ? `<img src="${escapeHtml(safeUrl(project.imageUrl))}" alt="${escapeHtml(project.title)}" loading="lazy" data-fallback="${escapeHtml(project.title.slice(0, 2).toUpperCase())}" onerror="this.parentElement.textContent=this.dataset.fallback" />`
        : escapeHtml(project.title.slice(0, 2).toUpperCase());
      const tags = project.tags.slice(0, 4).map((t) => `<span class="tag">${escapeHtml(t)}</span>`).join('');
      const authorProfile = authorProfiles.get(project.uid);
      const authorLevel = authorLevels.get(project.uid);
      return `
        <article class="card">
          <div class="card-thumb">${thumb}</div>
          <div class="card-body">
            <h3><a href="project.html?id=${encodeURIComponent(project.id)}">${escapeHtml(project.title)}</a></h3>
            <p class="card-summary">${escapeHtml(project.summary || project.description.slice(0, 120))}</p>
            <div class="tag-list">${typeBadgeHtml(project.type)}${tags}</div>
            <div class="card-meta">
              <span class="card-author">
                ${avatarHtml(authorProfile ? authorProfile.avatarUrl : '', project.authorName, 'avatar-sm')}
                <a href="profile.html?user=${encodeURIComponent(project.uid)}">${escapeHtml(project.authorName)}</a>
                ${authorLevel ? levelChipHtml(authorLevel.level, 'sm') : ''}
              </span>
              <span>${timeAgo(project.createdAt)}</span>
            </div>
          </div>
        </article>
      `;
    }

    function render() {
      const q = searchInput.value.trim().toLowerCase();
      const tag = tagFilter.value;
      const type = typeFilter.value;
      const onlyFollowing = peopleFilter.value === 'following';
      const filtered = allProjects.filter((p) => {
        if (onlyFollowing && !followingIds.has(p.uid)) return false;
        const matchesQ =
          !q ||
          p.title.toLowerCase().includes(q) ||
          p.summary.toLowerCase().includes(q) ||
          p.description.toLowerCase().includes(q);
        const matchesTag = !tag || p.tags.includes(tag);
        const matchesType = !type || p.type === type;
        return matchesQ && matchesTag && matchesType;
      });

      if (filtered.length === 0) {
        const emptyBody = onlyFollowing
          ? `<h3>Nothing from people you follow</h3><p>Follow a few more builders — or switch back to Everyone.</p><a class="btn btn-primary" href="leaderboard.html">Find people to follow</a>`
          : `<h3>No projects match your filters</h3><p>Try a different search term or tag.</p>`;
        container.innerHTML = `<div class="empty-state" style="grid-column: 1 / -1;">${emptyBody}</div>`;
        return;
      }
      container.innerHTML = filtered.map(projectCard).join('');
    }

    function populateTags() {
      const tags = new Set();
      allProjects.forEach((p) => p.tags.forEach((t) => tags.add(t)));
      [...tags].sort().forEach((t) => {
        const opt = document.createElement('option');
        opt.value = t;
        opt.textContent = t;
        tagFilter.appendChild(opt);
      });
    }

    searchInput.addEventListener('input', render);
    tagFilter.addEventListener('change', render);
    typeFilter.addEventListener('change', render);
    peopleFilter.addEventListener('change', render);

    (async () => {
      try {
        allProjects = await getPublishedProjects();
        authorProfiles = await getProfilesByIds(allProjects.map((p) => p.uid));
        populateTags();
        render();

        // Only worth offering once we know who you follow.
        const user = await getCurrentUser().catch(() => null);
        if (user) {
          followingIds = await getFollowingIds(user.id).catch(() => new Set());
          if (followingIds.size) peopleFilter.hidden = false;
        }

        // Levels cost a few extra queries, so they're loaded after the grid
        // is already on screen and painted in on a re-render rather than
        // holding up the projects themselves.
        authorLevels = await getLevelsForUsers(allProjects.map((p) => p.uid)).catch(() => new Map());
        render();
      } catch (err) {
        container.innerHTML = `<p>Could not load projects: ${escapeHtml(err.message)}</p>`;
      }
    })();
  </script>
</body>
</html>
