  <main>
    <div class="explore-shell">
      <div class="explore-head">
        <h1 class="feed-title">Explore</h1>
        <form class="rail-search explore-search" role="search" id="explore-form">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="icon" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input type="search" id="search-input" name="q" placeholder="Search posts, tags and people" aria-label="Search posts, tags and people" autocomplete="off" />
        </form>
        <div class="chip-row" id="type-chips" role="toolbar" aria-label="Filter by type"></div>
        <div class="chip-row" id="active-filters" hidden></div>
      </div>

      <section class="explore-people" id="people-results" hidden aria-labelledby="people-title">
        <h2 class="explore-section-title" id="people-title">People</h2>
        <div class="people-strip" id="people-list"></div>
      </section>

      <h2 class="explore-section-title" id="posts-title">Posts</h2>
      <div id="projects-container" class="tile-grid" aria-labelledby="posts-title">
        <div class="tile tile-skeleton" aria-hidden="true"></div>
        <div class="tile tile-skeleton" aria-hidden="true"></div>
        <div class="tile tile-skeleton" aria-hidden="true"></div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span>© <span id="year"></span> Showcase</span>
      <a href="/index.html">Home</a>
    </div>
  </footer>

  <script type="module" src="/js/theme.js"></script>
  <script type="module" src="/js/nav.js"></script>
  <script type="module" src="/js/bottom-nav.js"></script>
  <script type="module" src="/js/cookie-consent.js"></script>
  <script type="module" src="/js/pwa.js"></script>
  <script type="module" src="/js/animations.js"></script>
  <script type="module">
    import { DISCOVER_POOL, getPublishedProjects } from '/js/projects-data.js';
    import { getAllProfiles } from '/js/profiles-data.js';
    import { escapeHtml, avatarHtml, PROJECT_TYPES } from '/js/utils.js';
    import { getLikeCounts } from '/js/likes-data.js';
    import { getCommentCounts } from '/js/comments-data.js';
    import { tileHtml } from '/js/post-card.js';
    import { icon } from '/js/icons.js';
    import { effectClass } from '/js/shop-items.js';

    // Explore: one search box over posts, tags and people, type chips, and a
    // tag filter that any #tag elsewhere on the site links into. The query
    // and filters live in the URL, so a search can be shared and survives a
    // reload or the back button.

    document.getElementById('year').textContent = new Date().getFullYear();

    const container = document.getElementById('projects-container');
    const searchInput = document.getElementById('search-input');
    const typeChips = document.getElementById('type-chips');
    const activeFilters = document.getElementById('active-filters');
    const peopleResults = document.getElementById('people-results');
    const peopleList = document.getElementById('people-list');

    const params = new URLSearchParams(window.location.search);
    const state = {
      q: params.get('q') || '',
      type: PROJECT_TYPES[params.get('type')] ? params.get('type') : '',
      tag: params.get('tag') || '',
      projects: [],
      profiles: [],
      profileMap: new Map(),
      likeCounts: new Map(),
      commentCounts: new Map(),
    };
    searchInput.value = state.q;

    function syncUrl() {
      const next = new URLSearchParams();
      if (state.q) next.set('q', state.q);
      if (state.type) next.set('type', state.type);
      if (state.tag) next.set('tag', state.tag);
      const qs = next.toString();
      history.replaceState(null, '', qs ? `?${qs}` : window.location.pathname);
    }

    function renderChips() {
      const options = [{ value: '', label: 'Everything', icon: 'grid' }].concat(
        Object.entries(PROJECT_TYPES).map(([value, meta]) => ({ value, label: meta.label, icon: meta.icon }))
      );
      typeChips.innerHTML = options
        .map(
          (o) => `<button class="chip" type="button" data-type="${o.value}" aria-pressed="${state.type === o.value}">${icon(o.icon, { size: 15 })}${escapeHtml(o.label)}</button>`
        )
        .join('');
      activeFilters.hidden = !state.tag;
      activeFilters.innerHTML = state.tag
        ? `<button class="chip chip-active" type="button" data-clear-tag>#${escapeHtml(state.tag)} ${icon('x', { size: 14 })}<span class="visually-hidden">Remove tag filter</span></button>`
        : '';
    }

    function matches(project, q) {
      if (!q) return true;
      return (
        project.title.toLowerCase().includes(q) ||
        project.summary.toLowerCase().includes(q) ||
        project.description.toLowerCase().includes(q) ||
        project.authorName.toLowerCase().includes(q) ||
        project.tags.some((t) => t.toLowerCase().includes(q))
      );
    }

    function renderPeople() {
      const q = state.q.trim().toLowerCase();
      const people = q ? state.profiles.filter((p) => p.displayName.toLowerCase().includes(q)).slice(0, 12) : [];
      peopleResults.hidden = people.length === 0;
      peopleList.innerHTML = people
        .map(
          (p) => `
            <a class="person-card" href="/profile.html?user=${encodeURIComponent(p.id)}">
              ${avatarHtml(p.avatarUrl, p.displayName, effectClass(p.equippedBorder))}
              <span class="person-name ${effectClass(p.equippedNameEffect)}">${escapeHtml(p.displayName)}</span>
            </a>
          `
        )
        .join('');
    }

    function render() {
      const q = state.q.trim().toLowerCase();
      const filtered = state.projects.filter(
        (p) => matches(p, q) && (!state.type || p.type === state.type) && (!state.tag || p.tags.includes(state.tag))
      );
      renderPeople();
      if (filtered.length === 0) {
        container.innerHTML = `<div class="feed-empty" style="grid-column: 1 / -1;"><h3>No posts match</h3><p>Try another word, or clear the filters.</p></div>`;
        return;
      }
      container.innerHTML = filtered
        .map((p) =>
          tileHtml(p, {
            author: state.profileMap.get(p.uid),
            likeCount: state.likeCounts.get(p.id) || 0,
            commentCount: state.commentCounts.get(p.id) || 0,
          })
        )
        .join('');
    }

    let searchTimer = null;
    searchInput.addEventListener('input', () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        state.q = searchInput.value;
        syncUrl();
        render();
      }, 120);
    });
    document.getElementById('explore-form').addEventListener('submit', (e) => e.preventDefault());

    typeChips.addEventListener('click', (e) => {
      const chip = e.target.closest('[data-type]');
      if (!chip) return;
      state.type = chip.dataset.type;
      syncUrl();
      renderChips();
      render();
    });
    activeFilters.addEventListener('click', (e) => {
      if (!e.target.closest('[data-clear-tag]')) return;
      state.tag = '';
      syncUrl();
      renderChips();
      render();
    });

    renderChips();

    (async () => {
      try {
        // Search, tags and type filters all run over what has been fetched, so
        // the pool is asked for explicitly. Past this many entries the oldest
        // drop out of search; searching server-side is the honest fix.
        const [projects, profiles] = await Promise.all([
          getPublishedProjects({ limit: DISCOVER_POOL }),
          getAllProfiles().catch(() => []),
        ]);
        state.projects = projects;
        state.profiles = profiles;
        state.profileMap = new Map(profiles.map((p) => [p.id, p]));
        render();
        container.classList.add('is-settled');

        const ids = projects.map((p) => p.id);
        const [likeCounts, commentCounts] = await Promise.all([
          getLikeCounts(ids).catch(() => new Map()),
          getCommentCounts(ids).catch(() => new Map()),
        ]);
        Object.assign(state, { likeCounts, commentCounts });
        render();
      } catch (err) {
        container.innerHTML = `<div class="feed-empty" style="grid-column: 1 / -1;"><h3>Could not load posts</h3><p>${escapeHtml(err.message)}</p></div>`;
      }
    })();
  </script>
</body>
