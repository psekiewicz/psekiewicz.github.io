</head>
<body>

      </a>
      <div class="nav-links">
        <a class="nav-link" href="/"><i class="icon" data-icon="rocket" style="width:22px;height:22px" aria-hidden="true"></i><span>Demos</span></a>
        <a class="nav-link" href="/news"><i class="icon" data-icon="globe" style="width:22px;height:22px" aria-hidden="true"></i><span>News</span></a>
        <a class="nav-link" href="/leaderboard"><i class="icon" data-icon="award" style="width:22px;height:22px" aria-hidden="true"></i><span>Leaderboard</span></a>
        <a class="nav-link" href="/shop"><i class="icon" data-icon="shopping-bag" style="width:22px;height:22px" aria-hidden="true"></i><span>Shop</span></a>
        <a class="nav-link" href="/dashboard"><i class="icon" data-icon="grid" style="width:22px;height:22px" aria-hidden="true"></i><span>Dashboard</span></a>
      </div>
      <div class="nav-right">
        <div class="nav-actions" id="nav-actions"></div>
        <div class="nav-tools" id="nav-tools">
          <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle dark mode"></button>
        </div>
      </div>
      <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <main>
    <div id="profile-root">
      <div class="profile-page"><div class="post-skeleton" aria-hidden="true"></div></div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span>© <span id="year"></span> XOXD</span>
      <a href="/">Browse demos</a>
    </div>
  </footer>

  <!-- Followers / following list modal -->
  <div class="modal-overlay" id="list-modal">
    <div class="modal">
      <div class="modal-head">
        <h2 id="list-modal-title" style="margin:0;">People</h2>
        <button class="modal-close" id="list-modal-close" type="button" aria-label="Close"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </div>
      <div class="follow-list" id="list-modal-body">
        <p>Loading…</p>
      </div>
    </div>
  </div>

  <!-- Achievement detail modal (tap a badge to see how to earn it) -->
  <div class="modal-overlay" id="achievement-modal">
    <div class="modal">
      <div class="modal-head">
        <h2 id="achievement-modal-title" style="margin:0;">Achievement</h2>
        <button class="modal-close" id="achievement-modal-close" type="button" aria-label="Close"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </div>
      <div id="achievement-modal-body" style="text-align:center;"></div>
    </div>
  </div>

  <script type="module" src="/js/theme.js"></script>
  <script type="module" src="/js/nav.js"></script>
  <script type="module" src="/js/bottom-nav.js"></script>
  <script type="module" src="/js/cookie-consent.js"></script>
  <script type="module" src="/js/pwa.js"></script>
  <script type="module" src="/js/animations.js"></script>
  <script type="module">
    import { getCurrentUser } from '/js/auth.js';
    import { getProfile } from '/js/profiles-data.js';
    import { getDemosByUser } from '/js/projects-data.js';
    import {
      isFollowing,
      followUser,
      unfollowUser,
      getFollowerCount,
      getFollowingCount,
      getFollowers,
      getFollowing,
    } from '/js/follows-data.js';
    import { escapeHtml, initials, timeAgo, typeBadgeHtml, safeUrl } from '/js/utils.js';
    import { icon } from '/js/icons.js';
    import { tileHtml } from '/js/post-card.js';
    import {
      getUserStats,
      computeAchievements,
      getTopAchievement,
      unrecordedAchievementIds,
    } from '/js/achievements.js';
    import {
      getAchievementRecords,
      recordAchievementUnlock,
      claimAchievement,
      EMPTY_ACHIEVEMENT_RECORDS,
    } from '/js/points-data.js';
    import { effectClass } from '/js/shop-items.js';
    import { levelFromStats, levelChipHtml } from '/js/levels.js';

    document.getElementById('year').textContent = new Date().getFullYear();

    const root = document.getElementById('profile-root');
    const profileUserId = new URLSearchParams(window.location.search).get('user');

    const listModal = document.getElementById('list-modal');
    const listModalTitle = document.getElementById('list-modal-title');
    const listModalBody = document.getElementById('list-modal-body');
    document.getElementById('list-modal-close').addEventListener('click', () => listModal.classList.remove('is-open'));
    listModal.addEventListener('click', (e) => {
      if (e.target === listModal) listModal.classList.remove('is-open');
    });

    const achievementModal = document.getElementById('achievement-modal');
    const achievementModalTitle = document.getElementById('achievement-modal-title');
    const achievementModalBody = document.getElementById('achievement-modal-body');
    document
      .getElementById('achievement-modal-close')
      .addEventListener('click', () => achievementModal.classList.remove('is-open'));
    achievementModal.addEventListener('click', (e) => {
      if (e.target === achievementModal) achievementModal.classList.remove('is-open');
    });

    // Tapping a badge is the only reliable way to see "how do I earn this"
    // on mobile - a `title` tooltip needs a hover that touchscreens don't have.
    function openAchievementModal(achievement, isOwnProfile, claimed, onClaimed) {
      achievementModalTitle.textContent = achievement.label;
      const statusClass = achievement.unlocked ? 'is-unlocked' : 'is-locked';
      let claimLine = '';
      if (isOwnProfile && achievement.unlocked) {
        claimLine = claimed
          ? `<p style="color:var(--color-success);font-weight:700;">${icon('check', { size: 14 })} Claimed +${achievement.reward} pts</p>`
          : `<button class="btn btn-primary" type="button" id="achievement-modal-claim-btn">Claim +${achievement.reward} pts</button>`;
      }
      achievementModalBody.innerHTML = `
        <div class="achievement-modal-icon ${statusClass}">${icon(achievement.icon, { size: 30 })}</div>
        <span class="achievement-modal-status ${statusClass}">${achievement.unlocked ? 'Unlocked' : 'Locked'}</span>
        <p>${escapeHtml(achievement.description)}</p>
        <p style="color:var(--color-text-faint);font-size:0.85rem;">Reward: +${achievement.reward} pts</p>
        ${claimLine}
      `;
      achievementModal.classList.add('is-open');

      const claimBtn = document.getElementById('achievement-modal-claim-btn');
      if (claimBtn) {
        claimBtn.addEventListener('click', async () => {
          claimBtn.disabled = true;
          try {
            await claimAchievement(achievement.id);
            achievementModal.classList.remove('is-open');
            await onClaimed();
          } catch (err) {
            alert(err.message);
            claimBtn.disabled = false;
          }
        });
      }
    }

    function renderPeopleList(people) {
      if (people.length === 0) return '<p>Nobody here yet.</p>';
      return people
        .map(
          (p) => `
            <a class="follow-list-item" href="/profile?user=${encodeURIComponent(p.id)}">
              <span class="avatar">${safeUrl(p.avatarUrl) ? `<img src="${escapeHtml(safeUrl(p.avatarUrl))}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">` : escapeHtml(initials(p.displayName))}</span>
              <span>${escapeHtml(p.displayName)}</span>
            </a>
          `
        )
        .join('');
    }

    async function openPeopleModal(title, loader) {
      listModalTitle.textContent = title;
      listModalBody.innerHTML = '<p>Loading…</p>';
      listModal.classList.add('is-open');
      try {
        const people = await loader();
        listModalBody.innerHTML = renderPeopleList(people);
      } catch (err) {
        listModalBody.innerHTML = `<p>Could not load: ${escapeHtml(err.message)}</p>`;
      }
    }

    async function render() {
      if (!profileUserId) {
        root.innerHTML = `<div class="empty-state"><h3>No profile specified</h3><p>Follow a link from a project card to view a profile.</p><a class="btn btn-primary" href="/">Browse demos</a></div>`;
        return;
      }

      let profile;
      try {
        profile = await getProfile(profileUserId);
      } catch (err) {
        root.innerHTML = `<div class="empty-state"><h3>Could not load profile</h3><p>${escapeHtml(err.message)}</p></div>`;
        return;
      }
      if (!profile) {
        root.innerHTML = `<div class="empty-state"><h3>Profile not found</h3><p>This account doesn't exist.</p><a class="btn btn-primary" href="/">Browse demos</a></div>`;
        return;
      }

      document.getElementById('page-title').textContent = `${profile.displayName} - XOXD`;

      const currentUser = await getCurrentUser();
      const isOwnProfile = currentUser && currentUser.id === profileUserId;

      const [projects, followerCount, followingCount, stats] = await Promise.all([
        getDemosByUser(profileUserId),
        getFollowerCount(profileUserId),
        getFollowingCount(profileUserId),
        getUserStats(profileUserId).catch(() => null),
      ]);
      // Readable for any profile, so someone else's permanently-earned
      // badges show up on their page too, not just your own.
      let records = await getAchievementRecords(profileUserId).catch(() => EMPTY_ACHIEVEMENT_RECORDS);

      // Anything the stats currently qualify for but that isn't on record
      // yet gets written down now, so it survives the project being
      // deleted later. Only possible on your own profile - the RPC records
      // for the signed-in user and re-checks eligibility server-side.
      if (isOwnProfile && stats) {
        const toRecord = unrecordedAchievementIds(stats, records.unlocked);
        if (toRecord.length) {
          await Promise.all(toRecord.map((id) => recordAchievementUnlock(id).catch(() => {})));
          records = await getAchievementRecords(profileUserId).catch(() => records);
        }
      }

      const claimedIds = records.claimed;
      const achievements = stats ? computeAchievements(stats, records.unlocked) : [];
      const topAchievement = stats ? getTopAchievement(stats, records.unlocked) : null;

      let following = false;
      if (currentUser && !isOwnProfile) {
        following = await isFollowing(currentUser.id, profileUserId);
      }

      const avatar = safeUrl(profile.avatarUrl)
        ? `<img src="${escapeHtml(safeUrl(profile.avatarUrl))}" alt="${escapeHtml(profile.displayName)}" />`
        : escapeHtml(initials(profile.displayName));

      let actionButton;
      if (isOwnProfile) {
        // No Log out here any more: the navbar carries it on desktop and the
        // burger menu on mobile, so the profile page doesn't need a third copy.
        actionButton = `<a class="btn btn-secondary" href="/settings">Edit profile</a>`;
      } else if (currentUser) {
        actionButton = `<button class="btn ${following ? 'btn-secondary' : 'btn-primary'}" id="follow-btn" type="button">${following ? 'Unfollow' : 'Follow'}</button>`;
      } else {
        actionButton = `<a class="btn btn-primary" href="/login?next=${encodeURIComponent('/profile?user=' + profileUserId)}">Log in to follow</a>`;
      }

      const projectsGrid =
        projects.length === 0
          ? `<div class="feed-empty"><h3>No demos yet</h3><p>${isOwnProfile ? 'Publish something with a live link and it shows up here.' : 'Nothing to try here so far.'}</p></div>`
          : `<div class="tile-grid">${projects.map((p) => tileHtml(p, { author: profile })).join('')}</div>`;

      const nameBadge = topAchievement
        ? `<span class="name-badge" title="${escapeHtml(topAchievement.label)} - ${escapeHtml(topAchievement.description)}">${icon(topAchievement.icon, { size: 17 })}</span>`
        : '';

      const nameEffectClass = effectClass(profile.equippedNameEffect);
      const borderEffectClass = effectClass(profile.equippedBorder);
      const bgEffectClass = effectClass(profile.equippedBg);
      // The equipped background is the cover band now, like a banner on any
      // other profile, rather than a tint behind all of the text.
      const coverClass = `profile-cover${bgEffectClass ? ` ${bgEffectClass}` : ''}`;

      const pointsRow = isOwnProfile
        ? `<a class="points-chip" href="/shop">${icon('award', { size: 16 })} ${profile.points} pts - Shop</a>`
        : '';

      // A shareable "wrapped"-style image of your own stats - own profile
      // only, same reasoning as reachRow above: it's a card worth posting,
      // not a stat line worth exposing about someone else.
      const shareCardRow = isOwnProfile && stats
        ? `<button class="btn btn-secondary" id="share-stats-btn" type="button" title="Share stats card" aria-label="Share stats card">${icon('share', { size: 16 })}</button>`
        : '';

      // Derived from the same stats the achievements grid uses, so the
      // level can never disagree with what the badges below it show.
      const lvl = stats ? levelFromStats(stats) : null;
      const levelChip = lvl ? levelChipHtml(lvl.level) : '';
      const levelProgress = lvl
        ? `
          <div class="level-progress">
            <div class="level-progress-head">
              <span>${lvl.xp.toLocaleString()} XP</span>
              <span>${lvl.xpToNextLevel.toLocaleString()} XP to Lv ${lvl.level + 1}</span>
            </div>
            <div class="level-progress-track">
              <div class="level-progress-fill" style="width:${(lvl.progress * 100).toFixed(1)}%"></div>
            </div>
          </div>
        `
        : '';

      // Where both currencies come from, shown plainly with what each one
      // is worth. Own profile only - it reads as a to-do list, not a
      // public stat line.
      const reachChip = (iconName, value, label, rate) =>
        `<span class="reach-chip" title="${escapeHtml(rate)}">${icon(iconName, { size: 14 })} <strong>${value.toLocaleString()}</strong> ${escapeHtml(label)}</span>`;
      const reachRow =
        isOwnProfile && stats
          ? `
            <div class="reach-row">
              ${reachChip('grid', stats.projectsPublished, 'published', '25 XP each for your first 20 entries - no points, those come from reach')}
              ${reachChip('eye', stats.uniqueViewers, 'viewers', '2 XP and 1 point each - counted once per person, not per reload')}
              ${reachChip('heart', stats.totalLikes, 'likes', '30 XP and 5 points each')}
              ${reachChip('message-circle', stats.commentsReceived, 'comments', '15 XP and 3 points each - comments other people left you')}
              ${reachChip('users', stats.followerCount, 'followers', '60 XP and 10 points each')}
            </div>
          `
          : '';

      const unlockedCount = achievements.filter((a) => a.unlocked).length;
      const achievementsSection = stats
        ? `
          <p class="hint">${unlockedCount} of ${achievements.length} unlocked</p>
          <div class="achievements-grid">
            ${achievements
              .map((a) => {
                let claimControl = '';
                if (isOwnProfile && a.unlocked) {
                  claimControl = claimedIds.has(a.id)
                    ? `<span class="shop-item-price">${icon('check', { size: 12 })} +${a.reward} pts</span>`
                    : `<button class="btn btn-primary btn-sm achievement-claim-btn" type="button" data-claim="${a.id}" data-reward="${a.reward}">Claim +${a.reward}</button>`;
                }
                return `
                  <div class="achievement-badge${a.unlocked ? ' is-unlocked' : ' is-locked'}" data-achievement-id="${a.id}">
                    <span class="achievement-icon">${icon(a.icon, { size: 22 })}</span>
                    <span class="achievement-label">${escapeHtml(a.label)}</span>
                    ${claimControl}
                  </div>
                `;
              })
              .join('')}
          </div>
        `
        : '';

      root.innerHTML = `
        <div class="profile-page">
          <div class="${coverClass}"></div>
          <div class="profile-card">
            <div class="profile-top">
              <div class="profile-avatar ${borderEffectClass}">${avatar}</div>
              <div class="profile-actions">${shareCardRow}${actionButton}</div>
            </div>
            <div class="profile-name-row">
              <h1><span class="${nameEffectClass}">${escapeHtml(profile.displayName)}</span>${nameBadge}</h1>
              ${levelChip}
            </div>
            ${profile.bio ? `<p class="profile-bio">${escapeHtml(profile.bio)}</p>` : ''}
            <div class="profile-stats">
              <div class="profile-stat">
                <span class="num">${projects.length}</span>
                <span class="label">Posts</span>
              </div>
              <button class="profile-stat" id="followers-stat" type="button">
                <span class="num">${followerCount}</span>
                <span class="label">Followers</span>
              </button>
              <button class="profile-stat" id="following-stat" type="button">
                <span class="num">${followingCount}</span>
                <span class="label">Following</span>
              </button>
            </div>
            ${levelProgress}
            ${reachRow}
            ${pointsRow}
          </div>

          <div class="feed-tabs profile-tabs" role="tablist" aria-label="Profile sections">
            <button class="feed-tab" type="button" role="tab" aria-selected="true" data-tab="posts">Posts</button>
            ${stats ? `<button class="feed-tab" type="button" role="tab" aria-selected="false" data-tab="achievements">Achievements · ${unlockedCount}</button>` : ''}
          </div>
          <div class="profile-panel" data-panel="posts">${projectsGrid}</div>
          <div class="profile-panel" data-panel="achievements" hidden>${achievementsSection}</div>
        </div>
      `;

      root.querySelectorAll('.profile-tabs [data-tab]').forEach((tab) => {
        tab.addEventListener('click', () => {
          root.querySelectorAll('.profile-tabs [data-tab]').forEach((t) => t.setAttribute('aria-selected', String(t === tab)));
          root.querySelectorAll('.profile-panel').forEach((p) => (p.hidden = p.dataset.panel !== tab.dataset.tab));
        });
      });

      document.getElementById('followers-stat').addEventListener('click', () => {
        openPeopleModal('Followers', () => getFollowers(profileUserId));
      });
      document.getElementById('following-stat').addEventListener('click', () => {
        openPeopleModal('Following', () => getFollowing(profileUserId));
      });

      const followBtn = document.getElementById('follow-btn');
      if (followBtn) {
        followBtn.addEventListener('click', async () => {
          followBtn.disabled = true;
          try {
            if (following) {
              await unfollowUser(currentUser.id, profileUserId);
            } else {
              await followUser(currentUser.id, profileUserId);
            }
            await render();
          } catch (err) {
            alert(err.message);
            followBtn.disabled = false;
          }
        });
      }

      root.querySelectorAll('[data-claim]').forEach((btn) => {
        btn.addEventListener('click', async (e) => {
          e.stopPropagation();
          btn.disabled = true;
          try {
            await claimAchievement(btn.dataset.claim);
            await render();
          } catch (err) {
            alert(err.message);
            btn.disabled = false;
          }
        });
      });

      const shareStatsBtn = document.getElementById('share-stats-btn');
      if (shareStatsBtn) {
        const originalLabel = shareStatsBtn.innerHTML;
        shareStatsBtn.addEventListener('click', async () => {
          shareStatsBtn.disabled = true;
          shareStatsBtn.textContent = 'Generating…';
          try {
            const { shareStatsCard } = await import('/js/stats-card.js');
            await shareStatsCard({ profile, lvl, stats, topAchievement });
          } catch (err) {
            alert(err.message);
          } finally {
            shareStatsBtn.disabled = false;
            shareStatsBtn.innerHTML = originalLabel;
          }
        });
      }

      root.querySelectorAll('.achievement-badge').forEach((badgeEl) => {
        badgeEl.addEventListener('click', () => {
          const a = achievements.find((x) => x.id === badgeEl.dataset.achievementId);
          if (a) openAchievementModal(a, isOwnProfile, claimedIds.has(a.id), render);
        });
      });
    }

    render();
  </script>
</body>
</html>
