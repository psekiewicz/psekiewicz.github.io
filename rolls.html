<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script>(function(){var t=localStorage.getItem('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rolls — Showcase</title>
  <meta name="description" content="Swipe through published projects, one at a time." />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a class="brand" href="/index.html">
        <span class="brand-mark">S</span>
        Showcase
      </a>
      <div class="nav-links">
        <a class="nav-link" href="index.html">Home</a>
        <a class="nav-link" href="projects.html">Projects</a>
        <a class="nav-link active" href="rolls.html">Rolls</a>
      </div>
      <div class="nav-right">
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle dark mode"></button>
        <div class="nav-actions" id="nav-actions"></div>
      </div>
      <button class="nav-toggle" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <main>
    <div id="rolls-root">
      <div class="container" style="padding-top: 48px;">
        <p>Loading projects…</p>
      </div>
    </div>
  </main>

  <script type="module" src="/js/theme.js"></script>
  <script type="module" src="/js/nav.js"></script>
  <script type="module" src="/js/bottom-nav.js"></script>
  <script type="module">
    import { getPublishedProjects } from '/js/projects-data.js';
    import { getProfilesByIds } from '/js/profiles-data.js';
    import { escapeHtml, avatarHtml } from '/js/utils.js';

    const root = document.getElementById('rolls-root');

    function rollCard(project, profiles) {
      const hasImage = Boolean(project.imageUrl);
      const bg = hasImage
        ? `<img class="roll-card-bg" src="${escapeHtml(project.imageUrl)}" alt="" onerror="this.remove(); this.closest('.roll-card').classList.remove('has-image');" />`
        : `<div class="roll-empty-icon" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;">${escapeHtml(project.title.slice(0, 2).toUpperCase())}</div>`;

      const tags = project.tags.slice(0, 5).map((t) => `<span class="tag">${escapeHtml(t)}</span>`).join('');
      const authorProfile = profiles.get(project.uid);

      const links = [];
      if (project.liveUrl) links.push(`<a class="btn btn-primary btn-sm" href="${escapeHtml(project.liveUrl)}" target="_blank" rel="noopener noreferrer">Visit ↗</a>`);
      if (project.repoUrl) links.push(`<a class="btn btn-secondary btn-sm" href="${escapeHtml(project.repoUrl)}" target="_blank" rel="noopener noreferrer">Source ↗</a>`);
      links.push(`<a class="btn btn-secondary btn-sm" href="project.html?id=${encodeURIComponent(project.id)}">Details</a>`);

      return `
        <section class="roll-card${hasImage ? ' has-image' : ''}">
          ${bg}
          <div class="roll-content">
            <a class="roll-author" href="profile.html?user=${encodeURIComponent(project.uid)}">
              ${avatarHtml(authorProfile ? authorProfile.avatarUrl : '', project.authorName, 'roll-avatar')}
              <span>@${escapeHtml(project.authorName)}</span>
            </a>
            <h2>${escapeHtml(project.title)}</h2>
            <p>${escapeHtml(project.summary || project.description.slice(0, 140))}</p>
            <div class="tag-list">${tags}</div>
            <div class="roll-links">${links.join('')}</div>
          </div>
        </section>
      `;
    }

    (async () => {
      try {
        const projects = await getPublishedProjects();
        if (projects.length === 0) {
          root.innerHTML = `
            <div class="container" style="padding-top:48px;">
              <div class="empty-state">
                <h3>No projects to show yet</h3>
                <p>Once people publish projects, they'll show up here.</p>
                <a class="btn btn-primary" href="projects.html">Browse projects</a>
              </div>
            </div>
          `;
          return;
        }
        const profiles = await getProfilesByIds(projects.map((p) => p.uid));
        root.innerHTML = `<div class="rolls-container">${projects.map((p) => rollCard(p, profiles)).join('')}</div>`;
      } catch (err) {
        root.innerHTML = `<div class="container" style="padding-top:48px;"><p>Could not load projects: ${escapeHtml(err.message)}</p></div>`;
      }
    })();
  </script>
</body>
</html>
