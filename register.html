<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script>(function(){var t=localStorage.getItem('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create account — Showcase</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#4f46e5" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Showcase" />
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a class="brand" href="/index.html">
        <span class="brand-mark">S</span>
        Showcase
      </a>
      <div class="nav-links">
        <a class="nav-link" href="index.html">Home</a>
        <a class="nav-link" href="projects.html">Projects</a>
        <a class="nav-link" href="scrolls.html">Scrolls</a>
      </div>
      <div class="nav-right">
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle dark mode"></button>
        <div class="nav-actions" id="nav-actions"></div>
      </div>
      <button class="nav-toggle" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <main>
    <div class="auth-shell">
      <div class="auth-card">
        <h1>Create your account</h1>
        <p class="sub">Start publishing your projects in minutes.</p>

        <div class="alert alert-error" id="form-alert"></div>
        <div class="alert alert-success" id="form-success"></div>

        <form id="register-form" novalidate>
          <div class="field">
            <label for="displayName">Display name</label>
            <input type="text" id="displayName" autocomplete="name" required minlength="2" maxlength="60" />
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" autocomplete="email" required />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" autocomplete="new-password" required minlength="6" />
            <div class="hint">At least 6 characters.</div>
          </div>
          <div class="field">
            <label for="confirm-password">Confirm password</label>
            <input type="password" id="confirm-password" autocomplete="new-password" required minlength="6" />
          </div>
          <div class="field checkbox-field">
            <input type="checkbox" id="age-confirm" required />
            <label for="age-confirm" style="margin:0;">I confirm that I am at least 13 years old.</label>
          </div>
          <button class="btn btn-primary btn-block" type="submit" id="submit-btn">Create account</button>
        </form>

        <p class="form-footer">Already have an account? <a href="login.html">Log in</a></p>
      </div>
    </div>
  </main>

  <script type="module" src="/js/theme.js"></script>
  <script type="module" src="/js/nav.js"></script>
  <script type="module" src="/js/bottom-nav.js"></script>
  <script type="module" src="/js/cookie-consent.js"></script>
  <script type="module" src="/js/pwa.js"></script>
  <script type="module">
    import { registerUser, getCurrentUser } from '/js/auth.js';

    const form = document.getElementById('register-form');
    const alertBox = document.getElementById('form-alert');
    const successBox = document.getElementById('form-success');
    const submitBtn = document.getElementById('submit-btn');

    function showError(message) {
      successBox.classList.remove('is-visible');
      alertBox.textContent = message;
      alertBox.classList.add('is-visible');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.classList.remove('is-visible');
      successBox.classList.remove('is-visible');

      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm-password').value;
      if (password !== confirmPassword) {
        showError('Passwords do not match.');
        return;
      }

      if (!document.getElementById('age-confirm').checked) {
        showError('You must confirm that you are at least 13 years old to create an account.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner"></span> Creating account…';

      try {
        const { session } = await registerUser(
          document.getElementById('email').value,
          password,
          document.getElementById('displayName').value.trim()
        );
        if (session) {
          // Email confirmation is off for this project — already logged in.
          window.location.href = '/dashboard.html';
        } else {
          // Email confirmation is on (Supabase's default): no session yet.
          form.reset();
          successBox.textContent = 'Account created! Check your email for a confirmation link, then log in.';
          successBox.classList.add('is-visible');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Create account';
        }
      } catch (err) {
        showError(err.message);
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create account';
      }
    });

    (async () => {
      const user = await getCurrentUser();
      if (user) window.location.href = '/dashboard.html';
    })();
  </script>
</body>
</html>
