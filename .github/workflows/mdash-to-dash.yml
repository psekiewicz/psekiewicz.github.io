name: Replace em dashes with regular dashes

# LLM-written code tends to sprinkle em dashes (U+2014) around. This sweeps
# every tracked text file every few days and swaps them for a plain hyphen,
# then commits the result straight to the default branch if anything changed.

on:
  schedule:
    - cron: '0 5 */3 * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace em dashes
        run: |
          set -euo pipefail
          git grep -zIl $'\xe2\x80\x94' -- . ':!.github/workflows/mdash-to-dash.yml' \
            | xargs -0 -r perl -CSD -i -pe 's/\x{2014}/-/g'

      - name: Commit and push if changed
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No em dashes found."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: replace em dashes with regular dashes"
          git push
