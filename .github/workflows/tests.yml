name: Tests

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

jobs:
  test:
    # Pinned: ubuntu-latest moved to 26.04, where playwright-core 1.56 has no
    # Chromium to install, so the smoke tests can't run there.
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm test

      - run: npm run test:rls
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

      # Every page, signed out and signed in, in a real browser against a fake
      # Supabase (tests/smoke/). playwright-core never downloads a browser on
      # its own, so this fetches the one its version expects.
      - run: npx playwright-core install --with-deps chromium

      - run: npm run test:smoke
