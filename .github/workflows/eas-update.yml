name: Publish OTA update

# Pushes the JavaScript/asset part of the app to phones that already have an
# APK installed, without a new build or a sideload. android.yml still produces
# the APK/AAB; this only ships what changed in JS.
#
# An update reaches only builds with the same runtimeVersion, which app.json
# pins to `expo.version`. So: bump `expo.version` whenever a change touches
# native code (a new native dependency, a plugin, app.json native settings).
# Otherwise installed apps would receive JS that expects native code they lack.
#
# Needs the repository secret EXPO_TOKEN (expo.dev > Account > Access tokens).

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/eas-update.yml'
  workflow_dispatch: {}

concurrency:
  group: eas-update
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Publish the update
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "::warning::No EXPO_TOKEN secret set - skipping the OTA update."
            exit 0
          fi
          npx eas-cli@latest update \
            --branch production \
            --platform android \
            --message "${{ github.sha }}" \
            --non-interactive
