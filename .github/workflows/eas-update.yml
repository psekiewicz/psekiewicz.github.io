name: Publish OTA update

# Pushes the JavaScript/asset part of the app to phones that already have an
# APK installed, without a new build or a sideload. android.yml still produces
# the APK/AAB; this only ships what changed in JS.
#
# An update reaches only builds with the same runtimeVersion. app.json sets it
# from a fingerprint of everything native - dependencies with native code,
# config plugins, app.json's native settings - so a change that needs a new APK
# changes it by itself, and installed apps never receive JS that expects
# native code they lack. It used to be `expo.version`, which relied on someone
# remembering to bump it; forgetting meant an update that crashed on launch.
# mobile/fingerprint.config.js leaves out the version fields, because
# android.yml stamps versionCode just before it builds and this job never sees
# that number. android.yml computes the APK's runtime version the same way,
# on a clean checkout before Gradle runs, and checks the built APK carries it.
#
# Needs the repository secret EXPO_TOKEN (expo.dev > Account > Access tokens).

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/eas-update.yml'
  workflow_dispatch: {}

concurrency:
  group: eas-update
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Publish the update
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "::warning::No EXPO_TOKEN secret set - skipping the OTA update."
            exit 0
          fi
          # An update is published to a *branch*, but installed apps ask for a
          # *channel*. EAS creates the channel on `eas build`; we build with
          # Gradle, so without this the manifest endpoint answers 404 "no
          # channel named production". Only create it when missing, so a channel
          # someone deliberately re-pointed is left alone.
          if ! npx eas-cli@latest channel:view production --non-interactive >/dev/null 2>&1; then
            npx eas-cli@latest channel:create production --non-interactive
            npx eas-cli@latest channel:edit production --branch production --non-interactive
          fi

          npx eas-cli@latest update \
            --branch production \
            --platform android \
            --message "${{ github.sha }}" \
            --non-interactive
