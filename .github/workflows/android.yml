name: Android APK

# The APK is a shell around the live site, so it only needs rebuilding when the
# shell itself changes — a content or CSS change ships through GitHub Pages and
# reaches installed apps without any of this. Publishing a GitHub release
# rebuilds it and attaches the APK to that release.
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Restore the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/showcase.jks"
            echo "SHOWCASE_KEYSTORE=$RUNNER_TEMP/showcase.jks" >> "$GITHUB_ENV"
          else
            echo "No KEYSTORE_BASE64 secret — this APK will be signed with the debug key."
          fi

      - name: Build release APK
        working-directory: android
        env:
          SHOWCASE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SHOWCASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SHOWCASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          # A release takes its version from the tag (v1.2.3 → 1.2.3); the
          # version code comes from the run number so every build is upgradable.
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION_NAME="${RELEASE_TAG#v}"
          ./gradlew --no-daemon assembleRelease \
            -PversionName="${VERSION_NAME:-1.0.0}" \
            -PversionCode="${GITHUB_RUN_NUMBER}"

      - uses: actions/upload-artifact@v4
        with:
          name: showcase-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Attach the APK to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/*.apk
