name: Build Android app

# Produces a real .apk and .aab from mobile/ — no WebView, no local Android
# SDK needed. The runner installs the JDK and Android SDK, `expo prebuild`
# generates the native android/ project (which is why it isn't committed), and
# Gradle builds it.
#
# The APK is the one you sideload onto a phone to try it. The AAB is the format
# Google Play requires for an upload. Both land in the run's Artifacts section.

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/android.yml'
  workflow_dispatch: {}

# A second push while a build is still running makes the first one's artifacts
# obsolete. Android builds are slow and minutes are finite, so drop the old one.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

# Only what the release step below needs. Everything else stays read-only.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      # Caches ~/.gradle across runs. A cold Android build spends a long time
      # just fetching AGP and the React Native artifacts.
      - uses: gradle/actions/setup-gradle@v4

      # `npm ci` rather than `npm install`: it installs exactly what the
      # committed lockfile pins, so a build that passed once keeps passing
      # instead of drifting when a transitive dependency publishes.
      #
      # Note there is deliberately no `expo install --fix` step. It rewrites
      # package.json mid-build, which would defeat the point of installing from
      # a lockfile. Run it locally when bumping the Expo SDK, then commit the
      # result — `mobile/README.md` says so.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # Also applies plugins/withReleaseSigning.js, which is what gives the
      # generated project a release signing config to point at below.
      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install

      # Release builds must be signed or Android won't install them. With no
      # keystore in secrets this generates one so the APK is installable for
      # testing — but it's a *fresh* key every run, which Play Store uploads
      # can't use (all updates to an app must carry the same signature).
      # To ship: create a keystore once, add the four secrets below, and this
      # step uses yours instead.
      - name: Set up signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "Using the keystore from repository secrets."
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            store_password="$KEYSTORE_PASSWORD"
            key_alias="$KEY_ALIAS"
            key_password="$KEY_PASSWORD"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret set — generating a throwaway key. The APK installs for testing but cannot be uploaded to Google Play."
            keytool -genkeypair -v \
              -keystore android/app/release.keystore \
              -alias showcase -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass showcase -keypass showcase \
              -dname "CN=Showcase, OU=Dev, O=Showcase, L=-, S=-, C=PL"
            store_password=showcase
            key_alias=showcase
            key_password=showcase
          fi
          # These property names are the ones plugins/withReleaseSigning.js
          # made the generated build.gradle read.
          #
          # The leading blank line is load-bearing: prebuild writes
          # gradle.properties with no trailing newline, so appending without it
          # welds the first property onto `android.minSdkVersion=24` and Gradle
          # dies parsing `24SHOWCASE_STORE_FILE=...` before it builds anything.
          {
            echo ""
            echo "SHOWCASE_STORE_FILE=release.keystore"
            echo "SHOWCASE_STORE_PASSWORD=$store_password"
            echo "SHOWCASE_KEY_ALIAS=$key_alias"
            echo "SHOWCASE_KEY_PASSWORD=$key_password"
          } >> android/gradle.properties

      - name: Build APK
        run: ./gradlew assembleRelease --no-daemon
        working-directory: mobile/android

      - name: Build AAB
        run: ./gradlew bundleRelease --no-daemon
        working-directory: mobile/android

      - name: Confirm the artifacts are not debug-signed
        # A release build that silently fell back to the debug key is worse
        # than a failed build, because it looks like a shippable APK. The
        # signing config falls back to the debug key by design when the Gradle
        # properties are missing, so this is the check that the properties
        # actually arrived.
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          if [ -z "$apk" ]; then
            echo "::error::No APK was produced."
            exit 1
          fi

          # Resolve exactly one apksigner. Runners carry several build-tools
          # versions, so a `build-tools/*/apksigner` glob expands to several
          # paths and the shell passes the extras as arguments — apksigner then
          # rejects its own sibling as an unknown command, writes to stderr, and
          # a piped `grep` finds no debug certificate in the empty stdout. That
          # reports a pass without having verified anything, which is the exact
          # failure this step exists to catch.
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          if [ -z "$apksigner" ]; then
            echo "::error::No apksigner found under $ANDROID_HOME/build-tools."
            exit 1
          fi

          # Capture first: under `set -e` a non-zero apksigner aborts the step,
          # so a broken invocation can never be mistaken for a clean signature.
          certs=$("$apksigner" verify --print-certs "$apk")
          if printf '%s' "$certs" | grep -qi 'CN=Android Debug'; then
            echo "::error::The APK is signed with the Android debug key — the signing properties did not reach Gradle."
            exit 1
          fi
          printf '%s\n' "$certs"
          echo "Signature check passed."
        working-directory: mobile/android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: showcase-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: showcase-aab
          path: mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      # Run artifacts expire after 90 days and need a GitHub login to fetch, so
      # they can't be what the download page points at. A release can: GitHub
      # serves the newest one's assets from a permanent
      # /releases/latest/download/<name> URL, which is what download/index.html
      # links to. It also keeps the APK out of the repository — a 75 MB binary
      # per version, committed, is history nobody can prune later.
      #
      # Pull requests are excluded: a proposed change should not become the
      # thing people download.
      - name: Publish a release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./app.json').expo.version")
          tag="android-v${version}-${{ github.run_number }}"

          apk=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          aab=$(find android/app/build/outputs/bundle/release -name '*.aab' | head -1)

          # Fixed asset names: the permanent download URL is built from them,
          # so they must not carry the version or the link would move.
          cp "$apk" showcase.apk
          cp "$aab" showcase.aab

          gh release create "$tag" showcase.apk showcase.aab \
            --title "Showcase ${version} (build ${{ github.run_number }})" \
            --latest \
            --notes "Android build ${{ github.run_number }} from \`${{ github.sha }}\`.

          Install \`showcase.apk\` on a phone; \`showcase.aab\` is the format Google Play takes.

          Always available at the unchanging link
          https://github.com/${{ github.repository }}/releases/latest/download/showcase.apk"
        working-directory: mobile
