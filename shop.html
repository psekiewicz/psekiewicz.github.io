<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script>(function(){var t=localStorage.getItem('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop — Showcase</title>
  <meta name="description" content="Spend points earned from achievements on profile cosmetics." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Showcase" />
  <meta property="og:title" content="Shop — Showcase" />
  <meta property="og:description" content="Spend points earned from achievements on profile cosmetics." />
  <meta property="og:url" content="https://psekiewicz.github.io/shop.html" />
  <meta property="og:image" content="https://psekiewicz.github.io/icons/social-preview.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Shop — Showcase" />
  <meta name="twitter:description" content="Spend points earned from achievements on profile cosmetics." />
  <meta name="twitter:image" content="https://psekiewicz.github.io/icons/social-preview.png" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="icon" href="/icons/icon-192.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#f2efe9" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#14120f" media="(prefers-color-scheme: dark)" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Showcase" />
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a class="brand" href="/index.html">
        <span class="brand-mark">S</span>
        Showcase
      </a>
      <div class="nav-links">
        <a class="nav-link" href="index.html">Home</a>
        <a class="nav-link" href="projects.html">Projects</a>
        <a class="nav-link" href="scrolls.html">Scrolls</a>
        <a class="nav-link" href="shop.html">Shop</a>
        <a class="nav-link" href="leaderboard.html">Leaderboard</a>
      </div>
      <div class="nav-right">
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle dark mode"></button>
        <div class="nav-actions" id="nav-actions"></div>
      </div>
      <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <main>
    <section class="section" id="shop-section" style="display:none;">
      <div class="container">
        <div class="section-head">
          <div>
            <h1 style="margin-bottom:6px;">Shop</h1>
            <p style="margin:0;">Spend points earned from achievements on cosmetics for your profile.</p>
          </div>
          <span class="points-chip" id="shop-points"></span>
        </div>
        <p>Don't have enough points yet? Head to your <a id="shop-profile-link" href="#">profile</a> and claim any achievements you've already earned.</p>
        <div id="shop-bundles"></div>
        <div class="shop-categories" id="shop-categories"></div>
      </div>
    </section>

    <div class="container" id="loading-region" style="padding-top:64px;">
      <p>Checking your session…</p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span>© <span id="year"></span> Showcase</span>
      <a href="dashboard.html">Back to dashboard</a>
    </div>
  </footer>

  <script type="module" src="/js/theme.js"></script>
  <script type="module" src="/js/nav.js"></script>
  <script type="module" src="/js/bottom-nav.js"></script>
  <script type="module" src="/js/cookie-consent.js"></script>
  <script type="module" src="/js/pwa.js"></script>
  <script type="module">
    import { onAuthChange } from '/js/auth.js';
    import { getProfile } from '/js/profiles-data.js';
    import { getOwnedItemIds, purchaseItem, purchaseBundle, equipItem } from '/js/shop-data.js';
    import {
      SHOP_CATEGORIES,
      SHOP_BUNDLES,
      itemsByCategory,
      effectClass,
      findItem,
      bundleListPrice,
      bundleMissingListPrice,
      bundlePriceFor,
    } from '/js/shop-items.js';
    import { escapeHtml, initials } from '/js/utils.js';
    import { icon } from '/js/icons.js';

    document.getElementById('year').textContent = new Date().getFullYear();

    const shopSection = document.getElementById('shop-section');
    const loadingRegion = document.getElementById('loading-region');
    const categoriesRoot = document.getElementById('shop-categories');
    const bundlesRoot = document.getElementById('shop-bundles');
    const pointsChip = document.getElementById('shop-points');

    let currentUser = null;
    let profile = null;
    let ownedIds = new Set();

    async function loadState() {
      const [p, owned] = await Promise.all([getProfile(currentUser.id), getOwnedItemIds(currentUser.id)]);
      profile = p;
      ownedIds = owned;
    }

    function equippedIdFor(category) {
      return { bg: profile.equippedBg, border: profile.equippedBorder, name: profile.equippedNameEffect }[category];
    }

    function previewFor(item) {
      if (item.category === 'bg') {
        return `<div class="shop-item-preview ${effectClass(item.id)}"></div>`;
      }
      if (item.category === 'border') {
        return `<div class="shop-item-preview shop-item-preview-avatar ${effectClass(item.id)}">${escapeHtml(
          initials(profile.displayName)
        )}</div>`;
      }
      return `<div class="shop-item-preview shop-item-preview-name"><span class="${effectClass(item.id)}">${escapeHtml(
        profile.displayName
      )}</span></div>`;
    }

    // A set previews as the three pieces arranged the way they'd sit on a
    // profile — background behind, avatar on it, name beside — so the card
    // shows what you'd actually be wearing rather than three swatches.
    function bundleCardHtml(bundle) {
      const items = bundle.items.map(findItem).filter(Boolean);
      const bg = items.find((i) => i.category === 'bg');
      const border = items.find((i) => i.category === 'border');
      const nameEffect = items.find((i) => i.category === 'name');

      const ownedCount = bundle.items.filter((id) => ownedIds.has(id)).length;
      const complete = ownedCount === bundle.items.length;
      const list = bundleListPrice(bundle);
      const price = bundlePriceFor(bundle, ownedIds);

      // Struck-through separate price first, then what the set actually
      // costs — read left to right that's "this much, no, this much".
      // When some of the set is already owned, both numbers are for the
      // members still missing, so the comparison stays honest: the pro-
      // rated charge against what those same pieces cost individually.
      let priceLine;
      if (complete) {
        priceLine = `<span class="shop-bundle-price">${icon('check', { size: 13 })} Owned</span>`;
      } else if (ownedCount > 0) {
        const missingList = bundleMissingListPrice(bundle, ownedIds);
        priceLine = `<span class="shop-bundle-price">
          <span class="shop-bundle-was">${missingList} pts</span>
          <strong>${price} pts</strong>
          <span>for the ${bundle.items.length - ownedCount} you're missing</span></span>`;
      } else {
        priceLine = `<span class="shop-bundle-price">
          <span class="shop-bundle-was">${list} pts</span>
          <strong>${price} pts</strong>
          <span class="shop-bundle-save">save ${list - price}</span></span>`;
      }

      const action = complete
        ? ''
        : `<button class="btn btn-primary btn-sm" type="button" data-action="buy-bundle" data-bundle="${bundle.id}">Buy set</button>`;

      return `
        <div class="shop-bundle-card">
          <div class="shop-bundle-preview ${bg ? effectClass(bg.id) : ''}">
            <span class="shop-item-preview shop-item-preview-avatar ${border ? effectClass(border.id) : ''}">${escapeHtml(
              initials(profile.displayName)
            )}</span>
            <span class="shop-bundle-preview-name ${nameEffect ? effectClass(nameEffect.id) : ''}">${escapeHtml(
              profile.displayName
            )}</span>
          </div>
          <div class="shop-bundle-head">
            <span class="shop-bundle-name">${escapeHtml(bundle.label)}</span>
            ${complete || ownedCount === 0 ? '' : `<span class="shop-item-price">${ownedCount}/${bundle.items.length} owned</span>`}
          </div>
          <p class="shop-bundle-blurb">${escapeHtml(bundle.blurb)}</p>
          ${priceLine}
          ${action}
        </div>
      `;
    }

    function cardHtml(item) {
      const owned = ownedIds.has(item.id);
      const equipped = equippedIdFor(item.category) === item.id;

      let action;
      if (equipped) {
        action = `<button class="btn btn-secondary btn-sm" type="button" data-action="unequip" data-category="${item.category}">Unequip</button>`;
      } else if (owned) {
        action = `<button class="btn btn-primary btn-sm" type="button" data-action="equip" data-category="${item.category}" data-item="${item.id}">Equip</button>`;
      } else {
        action = `<button class="btn btn-primary btn-sm" type="button" data-action="buy" data-item="${item.id}">Buy</button>`;
      }

      const priceLine = owned
        ? `<span class="shop-item-price">${icon('check', { size: 13 })} Owned</span>`
        : `<span class="shop-item-price">${icon('award', { size: 13 })} ${item.price} pts</span>`;

      return `
        <div class="shop-item-card${equipped ? ' is-equipped' : ''}${owned ? ' is-owned' : ''}">
          ${previewFor(item)}
          <span class="shop-item-name">${escapeHtml(item.label)}</span>
          ${priceLine}
          ${action}
        </div>
      `;
    }

    function render() {
      pointsChip.innerHTML = `${icon('award', { size: 16 })} ${profile.points} pts`;
      document.getElementById('shop-profile-link').href = `profile.html?user=${encodeURIComponent(currentUser.id)}`;

      bundlesRoot.innerHTML = `
        <h2 style="margin-bottom:4px;">Sets</h2>
        <p class="shop-category-hint">A background, a border and a nickname effect that go together — cheaper than the three on their own.</p>
        <div class="shop-bundle-grid">${SHOP_BUNDLES.map(bundleCardHtml).join('')}</div>
      `;

      categoriesRoot.innerHTML = SHOP_CATEGORIES.map(
        (cat) => `
          <div>
            <h2 style="margin-bottom:4px;">${escapeHtml(cat.label)}</h2>
            <p class="shop-category-hint">${escapeHtml(cat.hint)}</p>
            <div class="shop-grid">${itemsByCategory(cat.id).map(cardHtml).join('')}</div>
          </div>
        `
      ).join('');
    }

    async function handleShopClick(e) {
      const btn = e.target.closest('button[data-action]');
      if (!btn) return;
      btn.disabled = true;

      try {
        if (btn.dataset.action === 'buy-bundle') {
          await purchaseBundle(btn.dataset.bundle);
        } else if (btn.dataset.action === 'buy') {
          await purchaseItem(btn.dataset.item);
        } else if (btn.dataset.action === 'equip') {
          await equipItem(currentUser.id, btn.dataset.category, btn.dataset.item);
        } else if (btn.dataset.action === 'unequip') {
          await equipItem(currentUser.id, btn.dataset.category, 'none');
        }
        await loadState();
        render();
      } catch (err) {
        alert(err.message);
        btn.disabled = false;
      }
    }

    categoriesRoot.addEventListener('click', handleShopClick);
    bundlesRoot.addEventListener('click', handleShopClick);

    let initialized = false;
    onAuthChange(async (user) => {
      if (!user) {
        window.location.href = '/login.html?next=' + encodeURIComponent('/shop.html');
        return;
      }
      currentUser = user;
      if (initialized) return;
      initialized = true;

      try {
        await loadState();
        loadingRegion.style.display = 'none';
        shopSection.style.display = '';
        render();
      } catch (err) {
        loadingRegion.innerHTML = `<p>Could not load the shop: ${escapeHtml(err.message)}</p>`;
      }
    });
  </script>
</body>
</html>
