<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>XOXD</title>
  <!-- News had weekly issues before newsletters; each T&G issue is now an
       article with the same id, so a link here opens that article. -->
  <script>
    var id = new URLSearchParams(location.search).get('id');
    location.replace(id ? '/article?id=' + encodeURIComponent(id) : '/news');
  </script>
  <meta http-equiv="refresh" content="0; url=/news" />
</head>
<body>
  <p><a href="/news">Open News</a></p>
</body>
</html>
