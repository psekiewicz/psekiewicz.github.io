<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script>(function(){var t=localStorage.getItem('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="page-title">Project - Showcase</title>
  <meta name="description" content="A project published on Showcase." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Showcase" />
  <meta property="og:title" content="Project - Showcase" />
  <meta property="og:description" content="A project published on Showcase." />
  <meta property="og:url" content="https://psekiewicz.github.io/project.html" />
  <meta property="og:image" content="https://psekiewicz.github.io/icons/social-preview.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Project - Showcase" />
  <meta name="twitter:description" content="A project published on Showcase." />
  <meta name="twitter:image" content="https://psekiewicz.github.io/icons/social-preview.png" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="icon" href="/icons/icon-192.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#f2efe9" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#14120f" media="(prefers-color-scheme: dark)" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Showcase" />
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a class="brand" href="/index.html">
        <span class="brand-mark">S</span>
        Showcase
      </a>
      <div class="nav-links">
        <a class="nav-link" href="index.html">Home</a>
        <a class="nav-link" href="projects.html">Projects</a>
        <a class="nav-link" href="scrolls.html">Scrolls</a>
        <a class="nav-link" href="shop.html">Shop</a>
        <a class="nav-link" href="leaderboard.html">Leaderboard</a>
      </div>
      <div class="nav-right">
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle dark mode"></button>
        <div class="nav-actions" id="nav-actions"></div>
      </div>
      <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <main>
    <div id="project-root">
      <div class="container" style="padding-top: 48px;">
        <p>Loading project…</p>
      </div>
    </div>
    <div id="comments-root"></div>
  </main>

  <!-- Report modal -->
  <div class="modal-overlay" id="report-modal">
    <div class="modal" style="max-width:440px;">
      <div class="modal-head">
        <h2 style="margin:0;">Report entry</h2>
        <button class="modal-close" id="report-modal-close" type="button" aria-label="Close"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </div>
      <div id="report-modal-body"></div>
    </div>
  </div>

  <footer class="site-footer">
    <div class="container">
      <span>© <span id="year"></span> Showcase</span>
      <a href="projects.html">← Back to projects</a>
    </div>
  </footer>

  <script type="module" src="/js/theme.js"></script>
  <script type="module" src="/js/nav.js"></script>
  <script type="module" src="/js/bottom-nav.js"></script>
  <script type="module" src="/js/cookie-consent.js"></script>
  <script type="module" src="/js/pwa.js"></script>
  <script type="module">
    import { getProjectById } from '/js/projects-data.js';
    import { getProfile, getProfilesByIds } from '/js/profiles-data.js';
    import { escapeHtml, timeAgo, avatarHtml, typeBadgeHtml, safeUrl } from '/js/utils.js';
    import { icon } from '/js/icons.js';
    import { onAuthChange, displayNameOf } from '/js/auth.js';
    import { getComments, addComment, deleteComment } from '/js/comments-data.js';
    import { refreshProgress } from '/js/progress-watch.js';
    import { isAdmin } from '/js/admin-data.js';
    import { getLikeCounts, getLikedSet, likeProject, unlikeProject } from '/js/likes-data.js';
    import { logProjectView } from '/js/views-data.js';
    import { shareLink } from '/js/share.js';
    import { isSaved, saveProject, unsaveProject } from '/js/saves-data.js';
    import { REPORT_REASONS, reportProject } from '/js/reports-data.js';
    import { mediaHtml, parseMedia } from '/js/media.js';
    import { getLevelsForUsers, levelChipHtml } from '/js/levels.js';

    document.getElementById('year').textContent = new Date().getFullYear();

    const reportModal = document.getElementById('report-modal');
    document.getElementById('report-modal-close').addEventListener('click', () => reportModal.classList.remove('is-open'));
    reportModal.addEventListener('click', (e) => {
      if (e.target === reportModal) reportModal.classList.remove('is-open');
    });

    const root = document.getElementById('project-root');
    const commentsRoot = document.getElementById('comments-root');
    const id = new URLSearchParams(window.location.search).get('id');

    let currentUser = null;
    let currentUserIsAdmin = false;
    let currentProject = null;
    const likeState = { liked: false, count: 0, wired: false };

    // Saving is private: no count is shown, nothing is announced to the
    // author, and it pays them nothing. It's a shelf, not a signal.
    let saveState = { saved: false, wired: false };

    async function wireSaveButton(projectId) {
      const btn = document.getElementById('save-btn');
      if (!btn) return;

      if (!currentUser) {
        btn.disabled = false;
        btn.addEventListener('click', () => {
          window.location.href = '/login.html?next=' + encodeURIComponent(window.location.pathname + window.location.search);
        });
        return;
      }

      try {
        saveState.saved = await isSaved(currentUser.id, projectId);
      } catch {
        saveState.saved = false;
      }
      paintSaveButton();
      btn.disabled = false;

      if (saveState.wired) return;
      saveState.wired = true;
      btn.addEventListener('click', async () => {
        const next = !saveState.saved;
        // Painted before the round trip and rolled back if it fails -
        // a bookmark that lags behind the tap feels broken.
        saveState.saved = next;
        paintSaveButton();
        try {
          if (next) await saveProject(currentUser.id, projectId);
          else await unsaveProject(currentUser.id, projectId);
        } catch (err) {
          saveState.saved = !next;
          paintSaveButton();
          alert(err.message);
        }
      });
    }

    function paintSaveButton() {
      const btn = document.getElementById('save-btn');
      const label = document.getElementById('save-label');
      if (!btn || !label) return;
      btn.setAttribute('aria-pressed', String(saveState.saved));
      btn.classList.toggle('is-saved', saveState.saved);
      label.textContent = saveState.saved ? 'Saved' : 'Save';
    }

    function wireReportButton(projectId) {
      const btn = document.getElementById('report-btn');
      if (!btn) return;
      btn.addEventListener('click', async () => {
        if (!currentUser) {
          window.location.href = '/login.html?next=' + encodeURIComponent(window.location.pathname + window.location.search);
          return;
        }
        if (currentProject && currentProject.uid === currentUser.id) {
          alert("This is your own entry - edit or delete it instead.");
          return;
        }
        openReportModal(projectId);
      });
    }

    function openReportModal(projectId) {
      const overlay = document.getElementById('report-modal');
      const body = document.getElementById('report-modal-body');
      body.innerHTML = `
        <div class="field">
          <label for="report-reason">What's wrong with it?</label>
          <select id="report-reason">
            ${REPORT_REASONS.map((r) => `<option value="${escapeHtml(r.id)}">${escapeHtml(r.label)}</option>`).join('')}
          </select>
        </div>
        <div class="field">
          <label for="report-note">Anything to add? (optional)</label>
          <textarea id="report-note" rows="3" maxlength="500"></textarea>
        </div>
        <button class="btn btn-primary btn-block" id="report-submit" type="button">Send report</button>
      `;
      overlay.classList.add('is-open');

      document.getElementById('report-submit').addEventListener('click', async (e) => {
        e.target.disabled = true;
        try {
          const filed = await reportProject(
            projectId,
            currentUser.id,
            document.getElementById('report-reason').value,
            document.getElementById('report-note').value
          );
          body.innerHTML = filed
            ? '<p>Thanks - an admin will take a look.</p>'
            : '<p>You already reported this one. An admin will take a look.</p>';
        } catch (err) {
          alert(err.message);
          e.target.disabled = false;
        }
      });
    }

    function render(project, authorProfile) {
      document.getElementById('page-title').textContent = `${project.title} - Showcase`;

      const thumb = project.imageUrl
        ? `<img src="${escapeHtml(safeUrl(project.imageUrl))}" alt="${escapeHtml(project.title)}" data-fallback="${escapeHtml(project.title.slice(0, 2).toUpperCase())}" onerror="this.parentElement.textContent=this.dataset.fallback" />`
        : escapeHtml(project.title.slice(0, 2).toUpperCase());

      const tags = project.tags.map((t) => `<span class="tag">${escapeHtml(t)}</span>`).join('');

      const links = [];
      if (safeUrl(project.liveUrl)) links.push(`<a class="btn btn-primary" href="${escapeHtml(safeUrl(project.liveUrl))}" target="_blank" rel="noopener noreferrer">Visit live site ↗</a>`);
      if (safeUrl(project.repoUrl)) links.push(`<a class="btn btn-secondary" href="${escapeHtml(safeUrl(project.repoUrl))}" target="_blank" rel="noopener noreferrer">View source ↗</a>`);

      const draftBadge = project.published ? '' : '<span class="status-pill draft" style="margin-left:10px;">Draft - only visible to you</span>';

      const isOwner = Boolean(currentUser && currentUser.id === project.uid);
      const editButton = isOwner
        ? `<a class="btn btn-secondary btn-sm" href="dashboard.html?edit=${encodeURIComponent(project.id)}">${icon('pencil', { size: 15 })} Edit</a>`
        : '';

      root.innerHTML = `
        <section class="detail-hero">
          <div class="container">
            <a href="projects.html" class="nav-link" style="padding-left:0;">← Back to projects</a>
            <h1 style="margin-top:14px;">${escapeHtml(project.title)}${draftBadge}</h1>
            <div class="detail-meta">
              <span class="card-author">
                ${avatarHtml(authorProfile ? authorProfile.avatarUrl : '', project.authorName, 'avatar-sm')}
                <span>by <a href="profile.html?user=${encodeURIComponent(project.uid)}"><strong>${escapeHtml(project.authorName)}</strong></a></span>
                <span id="author-level"></span>
              </span>
              <span>·</span>
              <span>Published ${timeAgo(project.createdAt)}</span>
              <span>·</span>
              <span>${icon('eye', { size: 14 })} <span id="views-count">${project.viewsCount}</span> views</span>
            </div>
            <div class="tag-list">${typeBadgeHtml(project.type)}${tags}</div>
            <div class="engagement-bar">
              <button class="like-btn" id="like-btn" type="button" aria-pressed="false" disabled>
                ${icon('heart', { size: 17 })} <span id="like-count">–</span>
              </button>
              <a class="btn btn-secondary btn-sm" href="scrolls.html?project=${encodeURIComponent(project.id)}">${icon('film', { size: 15 })} View in Scrolls</a>
              <button class="btn btn-secondary btn-sm" id="save-btn" type="button" aria-pressed="false" disabled>${icon('bookmark', { size: 15 })} <span id="save-label">Save</span></button>
              <button class="btn btn-secondary btn-sm" id="share-btn" type="button">${icon('share', { size: 15 })} Share</button>
              ${editButton}
              <button class="btn btn-ghost btn-sm" id="report-btn" type="button" title="Report this entry">${icon('flag', { size: 15 })} Report</button>
            </div>
          </div>
        </section>
        <section class="section">
          <div class="container">
            ${
              parseMedia(project.mediaUrl, project.type)
                ? mediaHtml(project.mediaUrl, { typeHint: project.type })
                : `<div class="detail-thumb">${thumb}</div>`
            }
            ${
              project.mediaUrl && !parseMedia(project.mediaUrl, project.type)
                ? `<p><a href="${escapeHtml(safeUrl(project.mediaUrl))}" target="_blank" rel="noopener noreferrer">${escapeHtml(project.mediaUrl)} ↗</a></p>`
                : ''
            }
            <div class="detail-body">${escapeHtml(project.description || project.summary || 'No description provided.')}</div>
            <div class="detail-links">${links.join('')}</div>
          </div>
        </section>
      `;

      wireSaveButton(project.id);
      wireReportButton(project.id);

      const shareBtn = document.getElementById('share-btn');
      if (shareBtn) {
        shareBtn.addEventListener('click', () =>
          shareLink({
            url: `/project.html?id=${encodeURIComponent(project.id)}`,
            title: project.title,
            text: project.summary || '',
          })
        );
      }

      wireLikeButton(project);
    }

    function updateLikeButtonUI() {
      const btn = document.getElementById('like-btn');
      if (!btn) return;
      btn.classList.toggle('is-liked', likeState.liked);
      btn.setAttribute('aria-pressed', String(likeState.liked));
      const countEl = document.getElementById('like-count');
      if (countEl) countEl.textContent = likeState.count;
    }

    async function wireLikeButton(project) {
      try {
        const counts = await getLikeCounts([project.id]);
        likeState.count = counts.get(project.id) || 0;
        likeState.liked = currentUser ? (await getLikedSet(currentUser.id, [project.id])).has(project.id) : false;
      } catch {
        // leave counts at their defaults
      }
      updateLikeButtonUI();

      const btn = document.getElementById('like-btn');
      if (!btn) return;
      btn.disabled = false;
      if (likeState.wired) return;
      likeState.wired = true;

      btn.addEventListener('click', async () => {
        if (!currentUser) {
          window.location.href = 'login.html?next=' + encodeURIComponent('/project.html?id=' + project.id);
          return;
        }
        btn.disabled = true;
        try {
          if (likeState.liked) {
            await unlikeProject(currentUser.id, project.id);
            likeState.liked = false;
            likeState.count = Math.max(0, likeState.count - 1);
          } else {
            await likeProject(currentUser.id, project.id);
            likeState.liked = true;
            likeState.count += 1;
          }
          updateLikeButtonUI();
        } catch (err) {
          alert(err.message);
        } finally {
          btn.disabled = false;
        }
      });
    }

    function showNotFound(message) {
      root.innerHTML = `<div class="container" style="padding-top:48px;"><div class="empty-state"><h3>Project not found</h3><p>${escapeHtml(message)}</p><a class="btn btn-primary" href="projects.html">Browse projects</a></div></div>`;
    }

    function commentItemHtml(comment, profile, canDelete, levelInfo) {
      return `
        <article class="comment" data-comment-id="${escapeHtml(comment.id)}">
          <div class="comment-head">
            ${avatarHtml(profile ? profile.avatarUrl : '', comment.authorName, 'avatar-sm')}
            <div class="comment-head-text">
              <span class="comment-author-row">
                <a href="profile.html?user=${encodeURIComponent(comment.userId)}" class="comment-author">${escapeHtml(comment.authorName)}</a>
                ${levelInfo ? levelChipHtml(levelInfo.level, 'sm') : ''}
              </span>
              <span class="comment-time">${timeAgo(comment.createdAt)}</span>
            </div>
            ${canDelete ? `<button class="comment-delete" type="button" data-id="${escapeHtml(comment.id)}" aria-label="Delete comment">${icon('trash', { size: 14 })}</button>` : ''}
          </div>
          <p class="comment-body">${escapeHtml(comment.body)}</p>
        </article>
      `;
    }

    async function renderComments(project) {
      commentsRoot.innerHTML = `<section class="section"><div class="container"><p>Loading comments…</p></div></section>`;

      let comments;
      try {
        comments = await getComments(project.id);
      } catch (err) {
        commentsRoot.innerHTML = `<section class="section"><div class="container"><p>Could not load comments: ${escapeHtml(err.message)}</p></div></section>`;
        return;
      }

      const [profiles, levels] = await Promise.all([
        getProfilesByIds(comments.map((c) => c.userId)).catch(() => new Map()),
        getLevelsForUsers(comments.map((c) => c.userId)).catch(() => new Map()),
      ]);

      const list = comments.length
        ? comments
            .map((c) => {
              const canDelete = Boolean(
                currentUser && (currentUser.id === c.userId || currentUser.id === project.uid || currentUserIsAdmin)
              );
              return commentItemHtml(c, profiles.get(c.userId), canDelete, levels.get(c.userId));
            })
            .join('')
        : '<p class="hint">No comments yet - be the first to say something.</p>';

      const form = currentUser
        ? `
          <form class="comment-form" id="comment-form">
            <textarea id="comment-body" placeholder="Write a comment…" maxlength="2000" required></textarea>
            <button class="btn btn-primary" type="submit">${icon('send', { size: 15 })} Post</button>
          </form>
        `
        : `<p class="hint"><a href="login.html?next=${encodeURIComponent('/project.html?id=' + project.id)}">Log in</a> to leave a comment.</p>`;

      commentsRoot.innerHTML = `
        <section class="section">
          <div class="container">
            <div class="section-head"><h2>Comments (${comments.length})</h2></div>
            ${form}
            <div class="comments-list">${list}</div>
          </div>
        </section>
      `;

      const commentForm = document.getElementById('comment-form');
      if (commentForm) {
        commentForm.addEventListener('submit', async (e) => {
          e.preventDefault();
          const textarea = document.getElementById('comment-body');
          const body = textarea.value.trim();
          if (!body) return;
          const submitBtn = commentForm.querySelector('button[type="submit"]');
          submitBtn.disabled = true;
          try {
            await addComment(project.id, currentUser.id, displayNameOf(currentUser), body);
            refreshProgress();
            await renderComments(project);
          } catch (err) {
            alert(err.message);
            submitBtn.disabled = false;
          }
        });
      }

      commentsRoot.querySelectorAll('.comment-delete').forEach((btn) => {
        btn.addEventListener('click', async () => {
          if (!confirm('Delete this comment?')) return;
          btn.disabled = true;
          try {
            await deleteComment(btn.dataset.id);
            await renderComments(project);
          } catch (err) {
            alert(err.message);
            btn.disabled = false;
          }
        });
      });
    }

    if (!id) {
      root.innerHTML = `<div class="container" style="padding-top:48px;"><div class="empty-state"><h3>No project specified</h3><p>Head back to the gallery to pick a project.</p><a class="btn btn-primary" href="projects.html">Browse projects</a></div></div>`;
    } else {
      // Wait for auth state to settle before reading, since draft visibility
      // depends on whether the signed-in user is the project's owner.
      let loaded = false;
      onAuthChange(async (user) => {
        currentUser = user;
        currentUserIsAdmin = user ? await isAdmin(user.id).catch(() => false) : false;

        if (!loaded) {
          loaded = true;
          try {
            const project = await getProjectById(id);
            if (!project) {
              showNotFound('This project does not exist or is not published.');
              return;
            }
            currentProject = project;
            const authorProfile = await getProfile(project.uid).catch(() => null);
            render(project, authorProfile);

            // Filled in after the page is up rather than blocking the
            // project itself on the extra level queries.
            getLevelsForUsers([project.uid])
              .then((levels) => {
                const slot = document.getElementById('author-level');
                const info = levels.get(project.uid);
                if (slot && info) slot.innerHTML = levelChipHtml(info.level, 'sm');
              })
              .catch(() => {});

            // Only move the counter if the server actually counted it -
            // your own views and a re-view within 6 hours don't.
            logProjectView(project.id)
              .then((counted) => {
                if (!counted) return;
                project.viewsCount += 1;
                const el = document.getElementById('views-count');
                if (el) el.textContent = project.viewsCount;
              })
              .catch(() => {});
          } catch {
            showNotFound('This project does not exist or is not published.');
            return;
          }
        }

        if (currentProject) renderComments(currentProject);
      });
    }
  </script>
</body>
</html>
