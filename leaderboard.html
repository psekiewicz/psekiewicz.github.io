<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta property="og:image" content="https://psekiewicz.github.io/icons/social-preview.png" />

  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Leaderboard — Showcase" />
  <meta name="twitter:description" content="The highest-levelled builders on Showcase." />

  <link rel="manifest" href="/manifest.webmanifest" />

  <meta name="theme-color" content="#14120f" media="(prefers-color-scheme: dark)" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />

</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a class="brand" href="/index.html">
        <span class="brand-mark">S</span>
        Showcase
      </a>
      <div class="nav-links">
        <a class="nav-link" href="index.html">Home</a>
        <a class="nav-link" href="projects.html">Projects</a>
        <a class="nav-link" href="scrolls.html">Scrolls</a>
        <a class="nav-link" href="shop.html">Shop</a>
        <a class="nav-link active" href="leaderboard.html">Leaderboard</a>
      </div>
      <div class="nav-right">
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle dark mode"></button>
        <div class="nav-actions" id="nav-actions"></div>
      </div>
      <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <main>
    <section class="section">
      <div class="container">
        <div class="section-head">
          <div>
            <h1 style="margin-bottom:6px;">Leaderboard</h1>
            <p style="margin:0;">Ranked by XP — 25 for each of your first 20 published entries, then from other people: 2 per person who opened one, 30 per like, 15 per comment, 60 per follower.</p>
          </div>
        </div>
        <div class="filter-bar">
          <input type="search" id="people-search" placeholder="Search people by name…" />
        </div>
        <div id="leaderboard-root">
          <p>Loading rankings…</p>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span>© <span id="year"></span> Showcase</span>
      <a href="projects.html">Browse projects</a>
    </div>
  </footer>

  <script type="module" src="/js/theme.js"></script>
  <script type="module" src="/js/nav.js"></script>
  <script type="module" src="/js/bottom-nav.js"></script>
  <script type="module" src="/js/cookie-consent.js"></script>
  <script type="module" src="/js/pwa.js"></script>
  <script type="module">
    import { getCurrentUser } from '/js/auth.js';
    import { getFollowingIds, followUser, unfollowUser } from '/js/follows-data.js';
    import { getAllProfiles } from '/js/profiles-data.js';
    import { getLevelsForUsers, levelChipHtml } from '/js/levels.js';
    import { effectClass } from '/js/shop-items.js';
    import { escapeHtml, avatarHtml } from '/js/utils.js';

    document.getElementById('year').textContent = new Date().getFullYear();

    const root = document.getElementById('leaderboard-root');
    const searchInput = document.getElementById('people-search');
    const TOP_N = 50;

    let ranked = [];
    let currentUser = null;
    let followingIds = new Set();

    function rowHtml(entry, position, isMe) {
      // Only the podium gets a medal class; everyone else shows a plain number.
      const medal = position <= 3 ? ` leaderboard-rank-${position}` : '';
      // The row is a link to the profile, so the follow control can't be a
      // nested <a>/<button> inside it — it sits alongside as a sibling.
      const follow =
        currentUser && !isMe
          ? `<button class="btn btn-sm ${followingIds.has(entry.profile.id) ? 'btn-secondary' : 'btn-primary'} leaderboard-follow"
               type="button" data-follow="${escapeHtml(entry.profile.id)}">${
              followingIds.has(entry.profile.id) ? 'Following' : 'Follow'
            }</button>`
          : '';
      return `
        <div class="leaderboard-row-wrap${isMe ? ' is-me' : ''}">
          <a class="leaderboard-row" href="profile.html?user=${encodeURIComponent(entry.profile.id)}">
            <span class="leaderboard-rank${medal}">${position}</span>
            ${avatarHtml(entry.profile.avatarUrl, entry.profile.displayName, effectClass(entry.profile.equippedBorder))}
            <span class="leaderboard-name">
              <span class="${effectClass(entry.profile.equippedNameEffect)}">${escapeHtml(entry.profile.displayName)}</span>
              ${isMe ? '<span class="leaderboard-you">you</span>' : ''}
            </span>
            ${levelChipHtml(entry.level.level, 'sm')}
            <span class="leaderboard-xp">${entry.level.xp.toLocaleString()} XP</span>
          </a>
          ${follow}
        </div>
      `;
    }

    // Ranks stay absolute: filtering by name must not renumber people, or
    // searching would tell you someone is #1 when they're #23.
    function paint() {
      const q = searchInput.value.trim().toLowerCase();
      const matches = q
        ? ranked.filter((e) => e.profile.displayName.toLowerCase().includes(q))
        : ranked.slice(0, TOP_N);

      if (matches.length === 0) {
        root.innerHTML = `<div class="empty-state"><h3>Nobody found</h3><p>No one matches “${escapeHtml(searchInput.value.trim())}”.</p></div>`;
        return;
      }

      let html = `<div class="leaderboard">${matches
        .map((entry) => rowHtml(entry, ranked.indexOf(entry) + 1, currentUser && currentUser.id === entry.profile.id))
        .join('')}</div>`;

      // If you didn't make the cut, show your own standing underneath rather
      // than leaving you to wonder where you are.
      const myIndex = !q && currentUser ? ranked.findIndex((e) => e.profile.id === currentUser.id) : -1;
      if (myIndex >= TOP_N) {
        html += `<p class="leaderboard-gap">…</p><div class="leaderboard">${rowHtml(ranked[myIndex], myIndex + 1, true)}</div>`;
      }
      root.innerHTML = html;
    }

    searchInput.addEventListener('input', paint);

    root.addEventListener('click', async (e) => {
      const btn = e.target.closest('[data-follow]');
      if (!btn) return;
      const targetId = btn.dataset.follow;
      btn.disabled = true;
      try {
        if (followingIds.has(targetId)) {
          await unfollowUser(currentUser.id, targetId);
          followingIds.delete(targetId);
        } else {
          await followUser(currentUser.id, targetId);
          followingIds.add(targetId);
        }
        paint();
      } catch (err) {
        alert(err.message);
        btn.disabled = false;
      }
    });

    (async () => {
      let profiles;
      try {
        profiles = await getAllProfiles();
      } catch (err) {
        root.innerHTML = `<p>Could not load the leaderboard: ${escapeHtml(err.message)}</p>`;
        return;
      }

      if (profiles.length === 0) {
        root.innerHTML = `<div class="empty-state"><h3>Nobody here yet</h3><p>Be the first to publish something.</p><a class="btn btn-primary" href="register.html">Create free account</a></div>`;
        return;
      }

      const [levels, user] = await Promise.all([
        getLevelsForUsers(profiles.map((p) => p.id)).catch(() => new Map()),
        getCurrentUser().catch(() => null),
      ]);
      currentUser = user;
      if (user) followingIds = await getFollowingIds(user.id).catch(() => new Set());

      ranked = profiles
        .map((profile) => ({ profile, level: levels.get(profile.id) }))
        .filter((entry) => entry.level)
        // Accounts that have never done anything would otherwise pad the
        // table with a wall of identical Lv 1 / 0 XP rows.
        .filter((entry) => entry.level.xp > 0)
        .sort((a, b) => b.level.xp - a.level.xp);

      if (ranked.length === 0) {
        root.innerHTML = `<div class="empty-state"><h3>No XP earned yet</h3><p>XP comes from other people finding your work — publish something and share it.</p></div>`;
        return;
      }

      paint();
    })();
  </script>
</body>
</html>
