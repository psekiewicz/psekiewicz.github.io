  <main>
    <div class="auth-shell">
      <div class="auth-card">
        <h1>Welcome back</h1>
        <p class="sub">Log in to manage your projects.</p>

        <div class="alert alert-error" id="form-alert"></div>
        <div class="alert alert-success" id="form-success"></div>

        <form id="reset-form" novalidate hidden>
          <div class="field">
            <label for="new-password">New password</label>
            <input type="password" id="new-password" autocomplete="new-password" required minlength="6" />
          </div>
          <div class="field">
            <label for="confirm-password">Confirm new password</label>
            <input type="password" id="confirm-password" autocomplete="new-password" required minlength="6" />
          </div>
          <button class="btn btn-primary btn-block" type="submit" id="reset-btn">Set new password</button>
        </form>

        <form id="login-form" novalidate>
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="username" required />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required />
          </div>
          <button class="btn btn-primary btn-block" type="submit" id="submit-btn">Log in</button>
        </form>

        <p class="form-footer"><a href="#" id="forgot-link">Forgot your password?</a></p>
        <p class="form-footer">Don't have an account? <a href="/register">Create one</a></p>
      </div>
    </div>
  </main>

  <script type="module" src="/js/theme.js"></script>
  <script type="module" src="/js/nav.js"></script>
  <script type="module" src="/js/bottom-nav.js"></script>
  <script type="module" src="/js/cookie-consent.js"></script>
  <script type="module" src="/js/pwa.js"></script>
  <script type="module" src="/js/animations.js"></script>
  <script type="module">
    import { loginUser, resetPassword, getCurrentUser, changePassword } from '/js/auth.js';

    const form = document.getElementById('login-form');
    const alertBox = document.getElementById('form-alert');
    const successBox = document.getElementById('form-success');
    const submitBtn = document.getElementById('submit-btn');

    function showError(message) {
      successBox.classList.remove('is-visible');
      alertBox.textContent = message;
      alertBox.classList.add('is-visible');
    }

    function showSuccess(message) {
      alertBox.classList.remove('is-visible');
      successBox.textContent = message;
      successBox.classList.add('is-visible');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.classList.remove('is-visible');
      successBox.classList.remove('is-visible');
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner"></span> Logging in…';

      try {
        await loginUser(document.getElementById('email').value, document.getElementById('password').value);
        const next = new URLSearchParams(window.location.search).get('next');
        window.location.href = next && next.startsWith('/') ? next : '/dashboard';
      } catch (err) {
        showError(err.message);
        submitBtn.disabled = false;
        submitBtn.textContent = 'Log in';
      }
    });

    document.getElementById('forgot-link').addEventListener('click', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      if (!email) {
        showError('Enter your email above first, then click "Forgot your password?" again.');
        return;
      }
      try {
        await resetPassword(email);
        showSuccess(`Password reset email sent to ${email}.`);
      } catch (err) {
        showError(err.message);
      }
    });

    // Read before the Supabase client tidies the address bar. A confirmation
    // link that has expired or was already used comes back with the reason in
    // the hash instead of a session.
    const hash = new URLSearchParams(window.location.hash.slice(1));
    const linkError = hash.get('error_description');
    const confirmed = new URLSearchParams(window.location.search).has('confirmed');
    // A password-reset link signs you in too. Moving on to the dashboard, as
    // for any signed-in visitor, would leave the old password in place, so
    // this asks for the new one first. type=recovery also catches links from
    // emails sent before the link carried ?reset=1.
    const recovering = new URLSearchParams(window.location.search).has('reset') || hash.get('type') === 'recovery';

    function showResetForm() {
      document.querySelector('.auth-card h1').textContent = 'Set a new password';
      document.querySelector('.auth-card .sub').textContent = 'Choose the password you will log in with from now on.';
      form.hidden = true;
      document.querySelectorAll('.auth-card .form-footer').forEach((el) => (el.hidden = true));
      resetForm.hidden = false;
      document.getElementById('new-password').focus();
    }

    const resetForm = document.getElementById('reset-form');
    const resetBtn = document.getElementById('reset-btn');
    resetForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = document.getElementById('new-password').value;
      if (password.length < 6) return showError('Password must be at least 6 characters long.');
      if (password !== document.getElementById('confirm-password').value) return showError('Passwords do not match.');
      resetBtn.disabled = true;
      resetBtn.innerHTML = '<span class="spinner"></span> Saving…';
      try {
        await changePassword(password);
        showSuccess('Your password is changed.');
        setTimeout(() => (window.location.href = '/dashboard'), 1500);
      } catch (err) {
        showError(err.message);
        resetBtn.disabled = false;
        resetBtn.textContent = 'Set new password';
      }
    });

    // If already logged in, skip straight to the dashboard. The confirmation
    // link signs the new account in on its own, so after confirming this is
    // the usual path - with a moment to say so first.
    (async () => {
      if (linkError) {
        showError(`${linkError}. If you already confirmed your email, just log in; otherwise register again for a new link.`);
        return;
      }
      const user = await getCurrentUser();
      if (recovering) {
        if (user) showResetForm();
        else showError('This reset link did not sign you in. Enter your email and click "Forgot your password?" for a new one.');
        return;
      }
      if (confirmed) {
        showSuccess(user ? 'Your email is confirmed - you are signed in.' : 'Your email is confirmed. Log in to continue.');
        if (user) setTimeout(() => (window.location.href = '/dashboard'), 1500);
        return;
      }
      if (user) window.location.href = '/dashboard';
    })();
  </script>
