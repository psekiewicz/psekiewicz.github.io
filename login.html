<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Limits what a page is allowed to load and where it may talk to.
       Scripts come from this origin and esm.sh (the two CDN imports:
       supabase-js and html2canvas); frames only from the four embed
       providers js/media.js rebuilds URLs for, so a media_url that
       slipped past that allowlist still cannot frame anything;
       object-src/base-uri shut the two classic ways an injected tag
       rewrites where the rest of the page loads from. Images and media
       stay open to any https host because entries legitimately point at
       one. Change the connect-src host if you move Supabase projects. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' https://esm.sh; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://esm.sh; frame-src https://www.youtube.com https://player.vimeo.com https://open.spotify.com https://w.soundcloud.com; worker-src 'self'; manifest-src 'self'" />
  <script>(function(){var t=localStorage.getItem('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in — Showcase</title>
  <meta name="description" content="Log in to your Showcase account." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Showcase" />
  <meta property="og:title" content="Log in — Showcase" />
  <meta property="og:description" content="Log in to your Showcase account." />
  <meta property="og:url" content="https://psekiewicz.github.io/login.html" />
  <meta property="og:image" content="https://psekiewicz.github.io/icons/social-preview.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Log in — Showcase" />
  <meta name="twitter:description" content="Log in to your Showcase account." />
  <meta name="twitter:image" content="https://psekiewicz.github.io/icons/social-preview.png" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="icon" href="/icons/icon-192.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#f2efe9" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#14120f" media="(prefers-color-scheme: dark)" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Showcase" />
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a class="brand" href="/index.html">
        <span class="brand-mark">S</span>
        Showcase
      </a>
      <div class="nav-links">
        <a class="nav-link" href="index.html">Home</a>
        <a class="nav-link" href="projects.html">Projects</a>
        <a class="nav-link" href="scrolls.html">Scrolls</a>
        <a class="nav-link" href="shop.html">Shop</a>
        <a class="nav-link" href="leaderboard.html">Leaderboard</a>
      </div>
      <div class="nav-right">
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle dark mode"></button>
        <div class="nav-actions" id="nav-actions"></div>
      </div>
      <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <main>
    <div class="auth-shell">
      <div class="auth-card">
        <h1>Welcome back</h1>
        <p class="sub">Log in to manage your projects.</p>

        <div class="alert alert-error" id="form-alert"></div>
        <div class="alert alert-success" id="form-success"></div>

        <form id="login-form" novalidate>
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="username" required />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required />
          </div>
          <button class="btn btn-primary btn-block" type="submit" id="submit-btn">Log in</button>
        </form>

        <p class="form-footer"><a href="#" id="forgot-link">Forgot your password?</a></p>
        <p class="form-footer">Don't have an account? <a href="register.html">Create one</a></p>
      </div>
    </div>
  </main>

  <script type="module" src="/js/theme.js"></script>
  <script type="module" src="/js/nav.js"></script>
  <script type="module" src="/js/bottom-nav.js"></script>
  <script type="module" src="/js/cookie-consent.js"></script>
  <script type="module" src="/js/pwa.js"></script>
  <script type="module">
    import { loginUser, resetPassword, getCurrentUser } from '/js/auth.js';
    import { safeNextPath } from '/js/utils.js';

    const form = document.getElementById('login-form');
    const alertBox = document.getElementById('form-alert');
    const successBox = document.getElementById('form-success');
    const submitBtn = document.getElementById('submit-btn');

    function showError(message) {
      successBox.classList.remove('is-visible');
      alertBox.textContent = message;
      alertBox.classList.add('is-visible');
    }

    function showSuccess(message) {
      alertBox.classList.remove('is-visible');
      successBox.textContent = message;
      successBox.classList.add('is-visible');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.classList.remove('is-visible');
      successBox.classList.remove('is-visible');
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner"></span> Logging in…';

      try {
        await loginUser(document.getElementById('email').value, document.getElementById('password').value);
        const next = new URLSearchParams(window.location.search).get('next');
        window.location.href = safeNextPath(next);
      } catch (err) {
        showError(err.message);
        submitBtn.disabled = false;
        submitBtn.textContent = 'Log in';
      }
    });

    document.getElementById('forgot-link').addEventListener('click', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      if (!email) {
        showError('Enter your email above first, then click "Forgot your password?" again.');
        return;
      }
      try {
        await resetPassword(email);
        showSuccess(`Password reset email sent to ${email}.`);
      } catch (err) {
        showError(err.message);
      }
    });

    // If already logged in, skip the form — but honour ?next= while doing
    // it. Opening a "log in to comment" link in a second tab of a session
    // that is still valid used to land on the dashboard and quietly lose
    // the page you were trying to get back to.
    (async () => {
      const user = await getCurrentUser();
      if (user) {
        window.location.href = safeNextPath(new URLSearchParams(window.location.search).get('next'));
      }
    })();
  </script>
</body>
</html>
